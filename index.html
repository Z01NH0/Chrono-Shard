  _baseUpdateEnemyBullets(dt);
};

function updateHazards(dt){
  const p=game.player;
  for(let i=game.hazards.length-1;i>=0;i--){
    const h=game.hazards[i];
    h.pulse=(h.pulse||0)+dt*2.2; h.damageCd=Math.max(0,(h.damageCd||0)-dt);
    if(h.life!==undefined){h.life-=dt;if(h.life<=0){game.hazards.splice(i,1);continue}}
    if(h.type==='laserColumn'){
      const active=Math.sin(h.pulse)>-0.15;
      if(active&&Math.abs(p.x-h.x)<h.width+p.r&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(9*(1-game.upgrades.hazardResist));h.damageCd=0.42}
    }
    if(h.type==='voidPool'){
      if(dist(p,h)<h.r+p.r&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(8*(1-game.upgrades.hazardResist));h.damageCd=0.5}
    }
    if(h.type==='sparkMine'){
      h.armed=Math.max(0,(h.armed||0)-dt);
      if(h.armed<=0&&dist(p,h)<h.r+p.r+8){
        addRing(h.x,h.y,'#ffd166',95,5);addParticles(h.x,h.y,'#ffd166',22,1);
        if(p.hurtCd<=0&&p.dashTime<=0) dealDamageToPlayer(16*(1-game.upgrades.hazardResist));
        damageEnemiesInRadius(h.x,h.y,95,26,'#ffd166',20);
        game.hazards.splice(i,1);continue;
      }
    }
    if(h.type==='rotatingLaser'){
      h.ang+=h.speed*dt;
      const dx=Math.cos(h.ang),dy=Math.sin(h.ang), px=p.x-h.x,py=p.y-h.y;
      const proj=clamp(px*dx+py*dy,-h.len/2,h.len/2);
      const perp=Math.abs(px*dy-py*dx);
      if(perp<h.width+p.r&&Math.abs(proj)<h.len/2&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(11*(1-game.upgrades.hazardResist));h.damageCd=0.35}
    }
    if(h.type==='chronoRift'){
      const d=dist(p,h);
      if(d<h.r+90){const a=angleTo(p,h);p.vx+=Math.cos(a)*(90*(1-d/(h.r+90)))*dt;p.vy+=Math.sin(a)*(90*(1-d/(h.r+90)))*dt;}
      if(d<h.r+p.r&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(10*(1-game.upgrades.hazardResist));h.damageCd=0.55}
    }
    if(h.type==='stormOrb'){
      h.x+=h.vx*dt;h.y+=h.vy*dt;
      if(h.x<60||h.x>W-60)h.vx*=-1; if(h.y<60||h.y>H-60)h.vy*=-1;
      if(dist(p,h)<h.r+p.r&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(12*(1-game.upgrades.hazardResist));h.damageCd=0.5}
      if(Math.random()<0.025) addLightning(h.x,h.y,h.x+rand(-80,80),h.y+rand(-80,80),'#9bedff');
    }
    if(h.type==='arcWall'){
      h.y+=h.dir*(42+game.wave)*dt; if(h.y<80||h.y>H-80)h.dir*=-1;
      if(Math.abs(p.y-h.y)<h.width+p.r&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(10*(1-game.upgrades.hazardResist));h.damageCd=0.45}
    }
    if(h.type==='poisonCloud'){
      for(let j=game.enemies.length-1;j>=0;j--){const e=game.enemies[j];if(dist(e,h)<h.r+e.r){e.poison=Math.max(e.poison||0,2.2);e.hp-=dt*18*game.upgrades.damage*(1+game.upgrades.acidMastery);e.hitFlash=0.08;if(e.hp<=0) enemyDeath(j,e)}}
    }
  }
}

};
useSkill = function(idx){
  const p=game.player;
  if(!game.running||game.skillCds[idx]>0) return;
  const skillKey=CLASSES[game.classKey].skills[idx];
  if(!ECLIPSE_SKILL_HANDLERS[skillKey]) return _baseUseSkill(idx);
  const sk=SKILL_DEFS[skillKey];
  if(p.focus<sk.focusCost) return;
  p.focus-=sk.focusCost; game.skillCds[idx]=sk.cooldown;
  ECLIPSE_SKILL_HANDLERS[skillKey]();
};

function drawGrid(){
  const t=game.time*0.7; const md=game.mapDecor||makeMapDecor(game.wave||1); const theme=md.theme;
  ctx.save();
  const g=ctx.createRadialGradient(W/2,H/2,70,W/2,H/2,520);
  g.addColorStop(0,theme.fog); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.lineWidth=0.9; ctx.strokeStyle=theme.grid+'18';
  for(let x=-40;x<W+40;x+=42){ctx.beginPath();ctx.moveTo(x+(t*22%42),0);ctx.lineTo(x+(t*22%42),H);ctx.stroke()}
  for(let y=-40;y<H+40;y+=42){ctx.beginPath();ctx.moveTo(0,y+(t*14%42));ctx.lineTo(W,y+(t*14%42));ctx.stroke()}
  ctx.strokeStyle=theme.accent+'22';ctx.lineWidth=2;ctx.strokeRect(8,8,W-16,H-16);
  for(const pad of md.pads){
    const rr=pad.r+Math.sin(pad.pulse)*4;
    ctx.globalAlpha=0.22; ctx.fillStyle=pad.type==='speed'?'#ffd166':'#61dafb';
    ctx.beginPath();ctx.arc(pad.x,pad.y,rr,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.8;ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(pad.x,pad.y,rr,0,Math.PI*2);ctx.stroke();
  }
  for(const o of md.obstacles){
    o.pulse+=0.015; ctx.globalAlpha=0.92; ctx.shadowBlur=16; ctx.shadowColor=theme.accent;
    const grd=ctx.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h); grd.addColorStop(0,'rgba(120,200,255,0.18)'); grd.addColorStop(1,'rgba(160,108,255,0.12)');
    ctx.fillStyle=grd; ctx.strokeStyle=theme.accent+'77'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,8);ctx.fill();ctx.stroke();
    ctx.globalAlpha=0.25+Math.sin(o.pulse)*0.08;ctx.fillStyle='#fff';ctx.fillRect(o.x+6,o.y+5,o.w-12,2);
  }
  ctx.restore();
}

function drawHazards(){
  for(const h of game.hazards){
    ctx.save();
    if(h.type==='laserColumn'){
      const active=Math.sin(h.pulse)>-0.15; ctx.globalAlpha=active?0.22:0.07; ctx.fillStyle=active?'#ff5ea0':'#5c2e44';ctx.fillRect(h.x-h.width,0,h.width*2,H);ctx.globalAlpha=active?0.9:0.2;const lg=ctx.createLinearGradient(h.x-3,0,h.x+3,0);lg.addColorStop(0,'rgba(255,100,160,0)');lg.addColorStop(0.5,active?'#ffc0d9':'#8b6c79');lg.addColorStop(1,'rgba(255,100,160,0)');ctx.fillStyle=lg;ctx.fillRect(h.x-8,0,16,H);
    }
    if(h.type==='voidPool'||h.type==='chronoRift'||h.type==='poisonCloud'){
      const col=h.type==='poisonCloud'?'#b6ff7a':h.type==='chronoRift'?'#ffd166':'#c6a0ff'; const pr=h.r+Math.sin(h.pulse*2.3)*7; const g=ctx.createRadialGradient(h.x,h.y,8,h.x,h.y,pr); g.addColorStop(0,col+'66'); g.addColorStop(0.55,col+'28'); g.addColorStop(1,col+'00'); ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,pr,0,Math.PI*2);ctx.fill();ctx.strokeStyle=col+'77';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(h.x,h.y,pr,0,Math.PI*2);ctx.stroke();
    }
    if(h.type==='sparkMine'){
      ctx.translate(h.x,h.y);ctx.rotate(h.pulse);ctx.shadowBlur=18;ctx.shadowColor='#ffd166';ctx.globalAlpha=h.armed>0?0.45:1;ctx.fillStyle='#ffd166';ctx.beginPath();for(let i=0;i<8;i++){const a=(Math.PI*2/8)*i;ctx.lineTo(Math.cos(a)*(i%2?h.r*0.45:h.r),Math.sin(a)*(i%2?h.r*0.45:h.r));}ctx.closePath();ctx.fill();
    }
    if(h.type==='rotatingLaser'){
      ctx.translate(h.x,h.y);ctx.rotate(h.ang);ctx.globalAlpha=0.25;ctx.fillStyle='#ff4d6d';ctx.fillRect(-h.len/2,-h.width,h.len,h.width*2);ctx.globalAlpha=0.9;ctx.fillStyle='#ffd1dc';ctx.fillRect(-h.len/2,-2,h.len,4);
    }
    if(h.type==='stormOrb'){
      ctx.shadowBlur=24;ctx.shadowColor='#9bedff';ctx.fillStyle='#9bedff';ctx.beginPath();ctx.arc(h.x,h.y,h.r+Math.sin(h.pulse*4)*3,0,Math.PI*2);ctx.fill();
    }
    if(h.type==='arcWall'){
      ctx.globalAlpha=0.28;ctx.fillStyle='#9bedff';ctx.fillRect(0,h.y-h.width,W,h.width*2);ctx.globalAlpha=0.9;ctx.fillStyle='#e6fbff';ctx.fillRect(0,h.y-2,W,4);
    }
    ctx.restore();
  }
}

function drawPlayer(){
  const p=game.player; const a=angleTo(p,mouse); const color=CLASSES[game.classKey].color; const cloaked=game.cloakActive>0;
  const blink=p.hurtCd>0 && Math.floor(game.time*28)%2===0;
  ctx.save();
  if(p.trail){for(let i=p.trail.length-1;i>=0;i--){const tr=p.trail[i];ctx.globalAlpha=(1-i/p.trail.length)*0.14*(cloaked?0.3:1);ctx.fillStyle=color;ctx.beginPath();ctx.arc(tr.x,tr.y,p.r*(1-i/p.trail.length)*0.85,0,Math.PI*2);ctx.fill();}}
  ctx.globalAlpha=blink?0.28:(cloaked?0.30:1); ctx.translate(p.x,p.y);ctx.rotate(a);
  if(p.shield>0){ctx.save();ctx.globalAlpha=(p.shield/p.maxShield)*0.38;ctx.strokeStyle='#4ce0b3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,p.r+9,0,Math.PI*2);ctx.stroke();ctx.restore();}
  if(game.parryTimer>0){ctx.strokeStyle='#ffe38c';ctx.lineWidth=2.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(0,0,p.r+18+Math.sin(game.time*10)*4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
  if(game.overclockTimer>0){ctx.strokeStyle='#8ff8ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,p.r+13,0,Math.PI*2);ctx.stroke();}
  if(game.elixirTimer>0){ctx.strokeStyle='#b6ff7a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,p.r+16,0,Math.PI*2);ctx.stroke();}
  ctx.shadowBlur=p.hurtCd>0?18:28;ctx.shadowColor=p.hurtCd>0?'#ff7b92':color;
  if(p.railPierceMode>0){ctx.strokeStyle='#ffe38c';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,p.r+8,0,Math.PI*2);ctx.stroke();}
  if(game.classKey==='assault'){ctx.beginPath();ctx.moveTo(0,-p.r-4);ctx.lineTo(p.r+5,0);ctx.lineTo(0,p.r+4);ctx.lineTo(-p.r+2,0);ctx.closePath();ctx.fillStyle=color;ctx.fill();}
  else if(game.classKey==='sniper'){ctx.beginPath();ctx.roundRect(-p.r,-p.r+2,p.r*2+5,p.r*2-4,8);ctx.fillStyle=color;ctx.fill();}
  else if(game.classKey==='reaper'||game.classKey==='ronin'){ctx.beginPath();for(let i=0;i<5;i++){const ang=(Math.PI*2/5)*i-Math.PI/2;const ang2=(Math.PI*2/5)*i+Math.PI/10-Math.PI/2;ctx.lineTo(Math.cos(ang)*(p.r+4),Math.sin(ang)*(p.r+4));ctx.lineTo(Math.cos(ang2)*(p.r-4),Math.sin(ang2)*(p.r-4));}ctx.closePath();ctx.fillStyle=color;ctx.fill();}
  else if(game.classKey==='engineer'){ctx.beginPath();ctx.roundRect(-p.r-2,-p.r-2,(p.r+2)*2,(p.r+2)*2,5);ctx.fillStyle=color;ctx.fill();ctx.fillStyle='#06101d';ctx.fillRect(-4,-4,8,8);}
  else if(game.classKey==='alchemist'){ctx.beginPath();for(let i=0;i<6;i++){const ang=(Math.PI*2/6)*i;ctx.lineTo(Math.cos(ang)*(p.r+2),Math.sin(ang)*(p.r+2));}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.fillStyle='#06101d';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();}
  else {ctx.beginPath();ctx.arc(0,0,p.r+2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.beginPath();ctx.arc(0,0,p.r-5,0,Math.PI*2);ctx.fillStyle='#f4eaff';ctx.fill();}
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(24,-5);ctx.lineTo(24,5);ctx.closePath();ctx.fillStyle='#f2fbff';ctx.fill();
  ctx.restore();
}

function drawDrones(){

function drawEnemies(){
  for(const e of game.enemies){
    ctx.save();ctx.translate(e.x,e.y);const pulse=1+Math.sin(game.time*6+e.wobble)*0.06;ctx.scale(pulse,pulse);ctx.shadowBlur=e.type==='boss'?34:e.elite?24:18;ctx.shadowColor=e.color;const frozen=game.timeStopActive>0||e.frozenTime>0;const fill=e.hitFlash>0?'#fff':(frozen?'#a0d8ff':e.poison>0?'#b6ff7a':e.color);
    if(e.type==='chaser'){ctx.beginPath();ctx.moveTo(0,-e.r);ctx.lineTo(e.r,0);ctx.lineTo(0,e.r);ctx.lineTo(-e.r,0);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
    if(e.type==='strafer'){ctx.beginPath();ctx.rect(-e.r,-e.r*0.8,e.r*2,e.r*1.6);ctx.fillStyle=fill;ctx.fill();ctx.fillStyle='#fff6dd';ctx.fillRect(-3,-e.r-5,6,9);}
    if(e.type==='tank'){ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(0,0,e.r-5,0,Math.PI*2);ctx.stroke();}
    if(e.type==='bomber'){ctx.beginPath();ctx.moveTo(0,-e.r-3);ctx.lineTo(e.r+3,0);ctx.lineTo(0,e.r+3);ctx.lineTo(-e.r-3,0);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.fillStyle='#fff2d9';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();}
    if(e.type==='swarmer'){ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
    if(e.type==='sentinel'){ctx.beginPath();for(let i=0;i<6;i++){const ang=(Math.PI*2/6)*i;ctx.lineTo(Math.cos(ang)*e.r,Math.sin(ang)*e.r);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();}
    if(e.type==='leaper'){ctx.beginPath();ctx.moveTo(0,-e.r-5);ctx.lineTo(e.r+6,e.r);ctx.lineTo(-e.r-6,e.r);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#fff2aa';ctx.beginPath();ctx.moveTo(-e.r,0);ctx.lineTo(e.r,0);ctx.stroke();}
    if(e.type==='medic'){ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#eaffef';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-e.r*0.55,0);ctx.lineTo(e.r*0.55,0);ctx.moveTo(0,-e.r*0.55);ctx.lineTo(0,e.r*0.55);ctx.stroke();}
    if(e.type==='sniperDrone'){ctx.beginPath();ctx.roundRect(-e.r,-e.r,e.r*2,e.r*2,5);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#dff6ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-e.r-5,0);ctx.lineTo(e.r+5,0);ctx.moveTo(0,-e.r-5);ctx.lineTo(0,e.r+5);ctx.stroke();}
    if(e.type==='splitter'){ctx.beginPath();for(let i=0;i<8;i++){const ang=(Math.PI*2/8)*i;ctx.lineTo(Math.cos(ang)*(i%2?e.r*0.55:e.r+3),Math.sin(ang)*(i%2?e.r*0.55:e.r+3));}ctx.closePath();ctx.fillStyle=fill;ctx.fill();}

function ensureRebalanceState(){

  game.upgrades.lifesteal = Math.min(game.upgrades.lifesteal,0.08);
}
function globalMonsterHpScale(wave=game.wave){
  return Math.pow(1.2, Math.floor((wave||1)/5));
}
function applyGlobalMonsterHp(e){
  if(!game||!e||e._globalHpScaleApplied) return e;
  const scale=globalMonsterHpScale(game.wave);
  if(scale>1){
    const pct=e.maxHp?clamp(e.hp/e.maxHp,0,1):1;
    e.maxHp=Math.ceil((e.maxHp||e.hp||1)*scale);
    e.hp=Math.max(1,Math.ceil(e.maxHp*pct));
  }
  e._globalHpScaleApplied=scale;
  return e;
}
function applyGlobalMonsterHpToNew(beforeIndex){
  for(let i=beforeIndex;i<game.enemies.length;i++) applyGlobalMonsterHp(game.enemies[i]);
}

function expandedRect(o,r=0){return {x:o.x-r,y:o.y-r,w:o.w+r*2,h:o.h+r*2}}
function pointInRect(x,y,o){return x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h}
function segSegIntersect(ax,ay,bx,by,cx,cy,dx,dy){
  const den=(dx-cx)*(by-ay)-(dy-cy)*(bx-ax);
  if(Math.abs(den)<0.00001) return false;
  const s=((bx-ax)*(ay-cy)-(by-ay)*(ax-cx))/den;
  const t=((dx-cx)*(ay-cy)-(dy-cy)*(ax-cx))/den;
  return s>=0&&s<=1&&t>=0&&t<=1;
}
function segmentIntersectsRect(x1,y1,x2,y2,o,r=0){
  const q=expandedRect(o,r);
  if(pointInRect(x1,y1,q)||pointInRect(x2,y2,q)) return true;
  const x=q.x,y=q.y,w=q.w,h=q.h;
  return segSegIntersect(x1,y1,x2,y2,x,y,x+w,y)||
         segSegIntersect(x1,y1,x2,y2,x+w,y,x+w,y+h)||
         segSegIntersect(x1,y1,x2,y2,x+w,y+h,x,y+h)||
         segSegIntersect(x1,y1,x2,y2,x,y+h,x,y);
}
function shotBlockedByMap(oldX,oldY,obj,extra=0){
  if(!game||!game.mapDecor||!game.mapDecor.obstacles) return false;
  const rr=(obj.r||3)+extra;
  for(const o of game.mapDecor.obstacles){
    if(segmentIntersectsRect(oldX,oldY,obj.x,obj.y,o,rr)) return true;
  }
  return false;
}
function lineBlockedByMap(a,b,extra=0){
  if(!game||!game.mapDecor||!game.mapDecor.obstacles) return false;
  for(const o of game.mapDecor.obstacles){
    if(segmentIntersectsRect(a.x,a.y,b.x,b.y,o,extra)) return true;
  }
  return false;
}

function updateMedicBuffTimers(dt){
  for(const e of game.enemies){

      e._medicBoostTimer-=dt;
      if(e._medicBoostTimer<=0&&e._medicSpeedBoost){

        e._medicSpeedBoost=0;

function buffAllyFromMedic(ally){
  if(!ally||ally.type==='medic') return;
  const shieldCap=ally.type==='boss'?ally.maxHp*0.10:ally.maxHp*0.42;
  ally.shieldHp=Math.min(shieldCap,(ally.shieldHp||0)+(ally.type==='boss'?34+game.wave:22+game.wave*0.8));
  if(ally.type!=='boss'&&!ally._medicSpeedBoost){
    ally._medicSpeedBoost=1.14;
    ally.speed*=ally._medicSpeedBoost;
  }
  ally._medicBoostTimer=2.8;
}
function nearestMedicAlly(medic){
  let target=null,best=Infinity;
  for(const e of game.enemies){
    if(e===medic||e.type==='medic') continue;
    const d=dist(medic,e);
    const injured=e.hp<e.maxHp?0.55:1;
    const bossBias=e.type==='boss'?0.45:1;
    const score=d*injured*bossBias;
    if(score<best){best=score;target=e;}
  }
  return target;
}
function nearestCoverPointAround(target){
  if(!game.mapDecor||!game.mapDecor.obstacles||!target) return null;
  let best=null,bestD=Infinity;
  for(const o of game.mapDecor.obstacles){
    const cx=o.x+o.w/2, cy=o.y+o.h/2;
    const d=Math.hypot(cx-target.x,cy-target.y);
    if(d<bestD){bestD=d;best={x:cx,y:cy,o};}
  }
  if(!best||bestD>230) return null;
  const away=angleTo(game.player,best);
  return {x:best.x+Math.cos(away)*(best.o.w/2+24),y:best.y+Math.sin(away)*(best.o.h/2+24)};
}
function postUpdateMedicAI(dt){
  const p=game.player;
  for(const medic of game.enemies){
    if(!medic||medic.type!=='medic') continue;
    const target=nearestMedicAlly(medic);
    if(target){
      const cover=nearestCoverPointAround(target);
      const away=angleTo(p,target);
      const desired=cover||{x:target.x+Math.cos(away)*58,y:target.y+Math.sin(away)*58};
      const da=angleTo(medic,desired), dd=dist(medic,desired);
      if(dd>32){
        medic.x+=Math.cos(da)*Math.min(medic.speed*0.95*dt,dd);
        medic.y+=Math.sin(da)*Math.min(medic.speed*0.95*dt,dd);
      }
      if(game.mapDecor&&game.mapDecor.obstacles){for(const o of game.mapDecor.obstacles) if(collideCircleRect(medic,o)) pushCircleOutRect(medic,o)}
    }
    medic.superHealCd=(medic.superHealCd||rand(0.2,0.7))-dt;
    if(medic.superHealCd<=0){
      const range=170;
      let healed=0;
      for(const ally of game.enemies){
        if(ally===medic) continue;
        if(dist(medic,ally)<range+ally.r){
          const heal=ally.type==='boss'?42+game.wave*1.7:58+game.wave*2.4;
          const before=ally.hp;
          ally.hp=clamp(ally.hp+heal,0,ally.maxHp);
          buffAllyFromMedic(ally);
          if(ally.hp>before||ally.type==='boss'||ally.shieldHp>0){addLightning(medic.x,medic.y,ally.x,ally.y,'#86ffb0');healed++;}
        }
      }
      if(healed){addRing(medic.x,medic.y,'#86ffb0',range,2);addFloatingText(medic.x,medic.y-20,'CURA+BUFF','#86ffb0',13)}
      medic.superHealCd=0.95;
    }
  }
}

    const oldX=b.x, oldY=b.y;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.weaponKey==='orb'){b.vx*=0.996;b.vy*=0.996}
    if(shotBlockedByMap(oldX,oldY,b,0)){
      addParticles(b.x,b.y,'#9bedff',6,0.35); addRing(b.x,b.y,'#9bedff',18,2);
      game.bullets.splice(i,1); continue;
    }
    if(b.life<=0||b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){game.bullets.splice(i,1);continue}
    if(b.weaponKey==='tesla'&&Math.random()<0.08){
      const t=nearestVisibleEnemyWithin(b,115);
      if(t){t.hp-=4*game.upgrades.damage;t.hitFlash=0.06;addLightning(b.x,b.y,t.x,t.y,'#9ff8ff')}
    }
    if(b.weaponKey==='acid'&&Math.random()<0.05){game.hazards.push({type:'poisonCloud',x:b.x,y:b.y,r:32,pulse:0,life:1.4,damageCd:0})}
    for(let j=game.enemies.length-1;j>=0;j--){
      const e=game.enemies[j];
      if(!circleCollide(b,e)) continue;
      if(lineBlockedByMap(b,e,(b.r||3))) continue;
      if(game.timeStopActive>0&&e.frozenTime>0) e.frozenTime=game.timeStopActive;
      const crit=Math.random()<game.upgrades.critChance;
      const dmg=crit?b.damage*2:b.damage;
      if(e.shieldHp>0){e.shieldHp-=dmg;if(e.shieldHp<0){e.hp+=e.shieldHp;e.shieldHp=0}}
      else e.hp-=dmg;
      e.hitFlash=0.1;
      addParticles(b.x,b.y,e.color,5,0.5);
      if(crit) addFloatingText(e.x,e.y-16,'CRÍTICO!','#ffd166',15);
      if(game.upgrades.lifesteal>0) game.player.hp=clamp(game.player.hp+dmg*Math.min(game.upgrades.lifesteal,0.08),0,game.player.maxHp);
      if(b.explosive){
        addRing(b.x,b.y,'#ff9966',55,4);
        for(let k=game.enemies.length-1;k>=0;k--){
          const ek=game.enemies[k];
          if(k!==j&&dist(b,ek)<55&&!lineBlockedByMap(b,ek,3)){ek.hp-=dmg*0.4;ek.hitFlash=0.08;if(ek.hp<=0) enemyDeath(k,ek);}
        }
        game.bullets.splice(i,1);
      }
      if(e.hp<=0) enemyDeath(j,e);
      b.pierce--;
      if(b.pierce<0){if(game.bullets[i]) game.bullets.splice(i,1);break}
    }
  }
};

updateEnemyBullets = function(dt){
  ensureRebalanceState();
  const p=game.player;
  if(game.parryTimer>0){
    for(let i=game.enemyBullets.length-1;i>=0;i--){
      const b=game.enemyBullets[i];
      if(dist(b,p)<72){
        const target=nearestVisibleEnemyWithin(p,620); const a=target?angleTo(p,target):angleTo(p,mouse);
        game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:4,life:0.9,damage:20*game.upgrades.damage,pierce:1,weaponKey:'rail',explosive:false});
        addLightning(p.x,p.y,b.x,b.y,'#ffe38c'); game.enemyBullets.splice(i,1); game.shake=5;
      }
    }
  }
  for(let i=game.enemyBullets.length-1;i>=0;i--){
    const b=game.enemyBullets[i];
    const oldX=b.x, oldY=b.y;
    if(b.homing&&game.timeStopActive<=0){
      const a=angleTo(b,p);
      b.vx+=(Math.cos(a)*300-b.vx)*dt*1.5;
      b.vy+=(Math.sin(a)*300-b.vy)*dt*1.5;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.fromBoss&&shotBlockedByMap(oldX,oldY,b,1)){
      addParticles(b.x,b.y,b.color||'#ff7d9d',5,0.3); addRing(b.x,b.y,b.color||'#ff7d9d',16,2);
      game.enemyBullets.splice(i,1); continue;
    }
    if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){game.enemyBullets.splice(i,1);continue}
    if(circleCollide(b,p)&&p.hurtCd<=0&&p.dashTime<=0){dealDamageToPlayer(b.damage);game.enemyBullets.splice(i,1)}
  }
};

    p.maxHp=Math.max(1,p.maxHp-remove);

      .sort((a,b)=>dist(p,a)-dist(p,b))
      .slice(0,Math.min(6,2+Math.floor(game.level/4)));
    for(const e of targets){
      if(!e._reaperMarked){
        e._reaperBaseSpeed=e.speed;
        e.speed*=0.70;
      }
      e.marked=true; e._reaperMarked=true; e.markedTimer=9;
      addRing(e.x,e.y,'#ff4d6d',48,4);
      addFloatingText(e.x,e.y-22,'MARCADO+','#ff4d6d',13);
    }
    if(targets.length){game.shake=8;eclipseNotice(`${targets.length} almas marcadas`,'#ff4d6d',16);}
  }
  function consumeIdentitySkill(idx,cooldownOverride){
    if(!game||!game.running) return null;
    const p=game.player;
    const skillKey=CLASSES[game.classKey].skills[idx];
    const sk=SKILL_DEFS[skillKey];
    if(!sk||game.skillCds[idx]>0||p.focus<sk.focusCost) return null;
    p.focus-=sk.focusCost;
    game.skillCds[idx]=cooldownOverride??sk.cooldown;
    return skillKey;
  }

  const _identityResetGame=resetGame;
  resetGame=function(classKey){
    _identityResetGame(classKey);
    safeEnsureIdentityState();
    game.meteors=[]; game.fireFields=[]; game.rewindSparks=[]; game.playerHistory=[];

  const _identityShoot=shoot;
  shoot=function(){
    if(!game||!game.running) return;

    _identityShoot();
    if(!game||game.bullets.length<=before) return;
    for(let i=before;i<game.bullets.length;i++){
      const b=game.bullets[i];
      if(game.classKey==='sniper'&&game.player.railPierceMode>0){
        b.damage*=1.4;
        b.sniperPierceShot=true;
        b.identityColor='#ffe38c';
      }
      if(game.classKey==='alchemist'&&b.weaponKey==='acid'){
        b.poison=true;
        b.identityColor='#b6ff7a';
      }
    }
  };

  const _identityUseSkill=useSkill;
  useSkill=function(idx){
    if(!game||!game.running) return;
    safeEnsureIdentityState();
    const skillKey=CLASSES[game.classKey].skills[idx];

    if(game.classKey==='sniper'&&skillKey==='pierceMode'){
      if(!consumeIdentitySkill(idx,5.2)) return;
      const p=game.player;
      p.railPierceMode=5.2;

      addRing(p.x,p.y,'#ffe38c',90,5);

      return;
    }
    if(game.classKey==='sniper'&&skillKey==='cloakDash'){
      if(!consumeIdentitySkill(idx,7)) return;
      game.cloakActive=3.4; game.cloakBonus=true;
      startDash();
      addRing(game.player.x,game.player.y,'#b0d8ff',120,4);
      eclipseNotice('CLOAK GHOST: monstros perderam você','#b0d8ff',15);
      return;
    }
    if(game.classKey==='mage'&&skillKey==='voidNova'){
      if(!consumeIdentitySkill(idx,9)) return;
      castMeteor(mouse.x,mouse.y,{r:132,impact:158,fireR:112,fireDps:7,color:'#c06cff'});
      return;
    }
    if(game.classKey==='mage'&&skillKey==='temporalLoop'){
      if(!consumeIdentitySkill(idx,20)) return;
      startRewind();
      return;
    }
    if(game.classKey==='reaper'&&skillKey==='deathMark'){
      if(!consumeIdentitySkill(idx,4.5)) return;
      markReaperTargets();
      return;
    }
    if(game.classKey==='alchemist'&&skillKey==='transmuteGold'){
      if(!consumeIdentitySkill(idx,15)) return;

    if(game.classKey==='alchemist'&&skillKey==='unstableElixir'){
      if(!consumeIdentitySkill(idx,10)) return;

        addFloatingText(p.x,p.y-28,`+${heal} HP`,'#b6ff7a',18);
        eclipseNotice('Poção de cura 50/50','#b6ff7a',15);

        eclipseNotice('50/50: incêndio alquímico','#ffb36b',15);

  const _identityUpdatePlayer=updatePlayer;
  updatePlayer=function(dt){
    safeEnsureIdentityState();
    const p=game.player;
    const oldX=p.x, oldY=p.y;
    _identityUpdatePlayer(dt);

    if(isSniperPiercing()&&!game.rewindActive){
      p.x=oldX+(p.x-oldX)*0.10;
      p.y=oldY+(p.y-oldY)*0.10;
      p.vx*=0.08; p.vy*=0.08;
      if(Math.random()<0.35) addParticles(p.x+rand(-8,8),p.y+rand(-8,8),'#ffe38c',1,0.25);
    }
    if(game.classKey==='sniper'&&!(p.railPierceMode>0)) cleanupSniperPierceHp();

    if(game.rewindActive){
      const r=game.rewindActive;
      r.time+=dt;
      const k=clamp(r.time/r.duration,0,1);
      const idx=Math.min(r.path.length-1,Math.floor(k*(r.path.length-1)));
      const node=r.path[idx]||r.target;
      p.x=node.x; p.y=node.y; p.vx=0; p.vy=0; p.dashTime=0;
      game.rewindSparks.push({x:p.x,y:p.y,life:0.35,maxLife:0.35,r:rand(3,8),color:'#c6a0ff'});
      if(Math.random()<0.55) addParticles(p.x,p.y,'#c6a0ff',2,0.28);
      if(r.time>=r.duration){
        p.x=r.target.x; p.y=r.target.y; game.rewindActive=null;
        addRing(p.x,p.y,'#c6a0ff',95,5);
      }
    }else{
      game.playerHistory.push({t:game.time,x:p.x,y:p.y,skillCds:[...game.skillCds]});
      while(game.playerHistory.length&&game.time-game.playerHistory[0].t>11.2) game.playerHistory.shift();
    }
  };

  function decayReaperMarks(){
    if(!game) return;
    for(const e of game.enemies){
      if(e._reaperMarked&&(!e.marked||e.markedTimer<=0)){
        if(e._reaperBaseSpeed) e.speed=e._reaperBaseSpeed;
        e._reaperMarked=false; e._reaperBaseSpeed=0;
      }
    }
  }
  function updateCloakWanderEnemies(dt){
    const p=game.player;
    for(let i=game.enemies.length-1;i>=0;i--){
      const e=game.enemies[i];
      if(e.type==='boss') continue;
      e.hitFlash=Math.max(0,(e.hitFlash||0)-dt);
      e.wobble=(e.wobble||0)+dt*3.2;
      if(e.marked){e.markedTimer-=dt;if(e.markedTimer<=0)e.marked=false;}
      if(e.poison>0){
        e.poison-=dt;
        e.hp-=dt*(6+game.wave*0.35)*(1+(game.upgrades.acidMastery||0));
        if(e.hp<=0){enemyDeath(i,e);continue;}
      }
      e._cloakWanderCd=(e._cloakWanderCd||0)-dt;
      if(e._cloakWanderCd<=0||e._cloakWanderAng===undefined){
        e._cloakWanderAng=rand(0,Math.PI*2);
        e._cloakWanderCd=rand(0.45,1.15);
      }
      const away=dist(e,p)<100?angleTo(p,e):e._cloakWanderAng;
      const sp=(e.speed||90)*(dist(e,p)<100?1.15:0.72);
      e.vx+=(Math.cos(away)*sp-e.vx)*dt*2.8;
      e.vy+=(Math.sin(away)*sp-e.vy)*dt*2.8;
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      e.x=clamp(e.x,20,W-20); e.y=clamp(e.y,20,H-20);
      if(game.mapDecor&&game.mapDecor.obstacles){for(const o of game.mapDecor.obstacles) if(collideCircleRect(e,o)) pushCircleOutRect(e,o)}
      if(Math.random()<0.025) addParticles(e.x,e.y,'#b0d8ff',1,0.15);
    }
  }

  const _identityUpdateEnemies=updateEnemies;
  updateEnemies=function(dt){
    safeEnsureIdentityState();
    if(isSniperCloaked()){
      const original=game.enemies;
      const hidden=original.filter(e=>e.type!=='boss');
      game.enemies=original.filter(e=>e.type==='boss');
      _identityUpdateEnemies(dt);
      const after=game.enemies;
      const bosses=after.filter(e=>e.type==='boss');
      const spawned=after.filter(e=>e.type!=='boss');
      game.enemies=bosses.concat(hidden,spawned);
      updateCloakWanderEnemies(dt);
      decayReaperMarks();
      if(Math.random()<0.08) addParticles(game.player.x,game.player.y,'#b0d8ff',2,0.2);
      return;
    }
    _identityUpdateEnemies(dt);
    decayReaperMarks();
  };

  updateBullets=function(dt){
    safeEnsureIdentityState();
    for(let i=game.bullets.length-1;i>=0;i--){
      const b=game.bullets[i];
      const oldX=b.x, oldY=b.y;
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(b.weaponKey==='orb'){b.vx*=0.996;b.vy*=0.996}
      if(typeof shotBlockedByMap==='function'&&shotBlockedByMap(oldX,oldY,b,0)){
        addParticles(b.x,b.y,'#9bedff',6,0.35); addRing(b.x,b.y,'#9bedff',18,2);
        game.bullets.splice(i,1); continue;
      }
      if(b.life<=0||b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){game.bullets.splice(i,1);continue}
      if(b.identityColor&&Math.random()<0.42) addParticles(b.x,b.y,b.identityColor,1,0.18);
      if(b.weaponKey==='tesla'&&Math.random()<0.08){
        const t=typeof nearestVisibleEnemyWithin==='function'?nearestVisibleEnemyWithin(b,115):nearestEnemyWithin(b,115);
        if(t){t.hp-=4*game.upgrades.damage;t.hitFlash=0.06;addLightning(b.x,b.y,t.x,t.y,'#9ff8ff')}
      }
      if((b.weaponKey==='acid'||b.poison)&&Math.random()<0.06){game.hazards.push({type:'poisonCloud',x:b.x,y:b.y,r:32,pulse:0,life:1.5,damageCd:0})}
      for(let j=game.enemies.length-1;j>=0;j--){
        const e=game.enemies[j];
        if(!circleCollide(b,e)) continue;
        if(typeof lineBlockedByMap==='function'&&lineBlockedByMap(b,e,(b.r||3))) continue;
        if(game.timeStopActive>0&&e.frozenTime>0) e.frozenTime=game.timeStopActive;
        const crit=Math.random()<game.upgrades.critChance;
        let dmg=crit?b.damage*2:b.damage;
        if(e._reaperMarked) dmg*=1.35;
        if(e.shieldHp>0){e.shieldHp-=dmg;if(e.shieldHp<0){e.hp+=e.shieldHp;e.shieldHp=0}}
        else e.hp-=dmg;
        e.hitFlash=0.1;
        if(b.weaponKey==='acid'||b.poison) poisonEnemy(e,3.4);
        addParticles(b.x,b.y,e._reaperMarked?'#ff4d6d':(b.identityColor||e.color),6,0.5);
        if(crit) addFloatingText(e.x,e.y-16,'CRÍTICO!','#ffd166',15);
        if(b.sniperPierceShot&&game.player.railPierceMode>0) addSniperPierceHp(10);
        if(e._reaperMarked&&game.classKey==='reaper'){
          const heal=Math.min(10,dmg*0.08);
          game.player.hp=clamp(game.player.hp+heal,0,game.player.maxHp);
          if(Math.random()<0.35) addFloatingText(game.player.x,game.player.y-22,`+${Math.ceil(heal)} alma`,'#ff7b9c',12);
        }
        if(game.upgrades.lifesteal>0) game.player.hp=clamp(game.player.hp+dmg*Math.min(game.upgrades.lifesteal,0.08),0,game.player.maxHp);
        if(b.explosive){
          addRing(b.x,b.y,'#ff9966',55,4);
          for(let k=game.enemies.length-1;k>=0;k--){
            const ek=game.enemies[k];
            if(k!==j&&dist(b,ek)<55&&!(typeof lineBlockedByMap==='function'&&lineBlockedByMap(b,ek,3))){ek.hp-=dmg*0.4;ek.hitFlash=0.08;if(ek.hp<=0) enemyDeath(k,ek);}
          }
          game.bullets.splice(i,1);
        }
        if(e.hp<=0) enemyDeath(j,e);
        b.pierce--;
        if(b.pierce<0){if(game.bullets[i]) game.bullets.splice(i,1);break}
      }
    }
  };

  updateEnemyBullets=function(dt){
    safeEnsureIdentityState();
    const p=game.player;
    if(game.parryTimer>0){
      for(let i=game.enemyBullets.length-1;i>=0;i--){
        const b=game.enemyBullets[i];
        if(dist(b,p)<72){
          const target=typeof nearestVisibleEnemyWithin==='function'?nearestVisibleEnemyWithin(p,620):nearestEnemyWithin(p,620);
          const a=target?angleTo(p,target):angleTo(p,mouse);
          game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:4,life:0.9,damage:20*game.upgrades.damage,pierce:1,weaponKey:'rail',explosive:false,identityColor:'#ffe38c'});
          addLightning(p.x,p.y,b.x,b.y,'#ffe38c'); game.enemyBullets.splice(i,1); game.shake=5;

    for(let i=game.enemyBullets.length-1;i>=0;i--){
      const b=game.enemyBullets[i];
      const oldX=b.x, oldY=b.y;
      if(isSniperCloaked()&&!b.fromBoss){
        b._cloakWanderCd=(b._cloakWanderCd||0)-dt;
        if(b._cloakWanderCd<=0||b._cloakWanderAng===undefined){b._cloakWanderAng=rand(0,Math.PI*2);b._cloakWanderCd=rand(0.25,0.75)}
        const sp=Math.max(120,Math.hypot(b.vx,b.vy)||190);
        b.vx+=(Math.cos(b._cloakWanderAng)*sp-b.vx)*dt*3.2;
        b.vy+=(Math.sin(b._cloakWanderAng)*sp-b.vy)*dt*3.2;
        b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
        if(Math.random()<0.12) addParticles(b.x,b.y,b.color||'#b0d8ff',1,0.16);
        if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){game.enemyBullets.splice(i,1)}
        continue;
      }
      if(b.homing&&game.timeStopActive<=0){
        const a=angleTo(b,p);
        b.vx+=(Math.cos(a)*300-b.vx)*dt*1.5;
        b.vy+=(Math.sin(a)*300-b.vy)*dt*1.5;
      }
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(b.fromBoss&&typeof shotBlockedByMap==='function'&&shotBlockedByMap(oldX,oldY,b,1)){
        addParticles(b.x,b.y,b.color||'#ff7d9d',5,0.3); addRing(b.x,b.y,b.color||'#ff7d9d',16,2);
        game.enemyBullets.splice(i,1); continue;
      }
      if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){game.enemyBullets.splice(i,1);continue}
      if(circleCollide(b,p)&&p.hurtCd<=0&&p.dashTime<=0){dealDamageToPlayer(b.damage);game.enemyBullets.splice(i,1)}

  const _identityUpdateHazards=updateHazards;
  updateHazards=function(dt){
    _identityUpdateHazards(dt);
    safeEnsureIdentityState();
    for(let i=game.meteors.length-1;i>=0;i--){
      const m=game.meteors[i];
      m.t-=dt;
      const k=1-clamp(m.t/m.maxT,0,1);
      const cx=m.fromX+(m.x-m.fromX)*k, cy=m.fromY+(m.y-m.fromY)*k;
      m.tail.push({x:cx,y:cy,life:0.32,maxLife:0.32});
      if(m.tail.length>18) m.tail.shift();
      if(m.t<=0){
        addRing(m.x,m.y,m.color,m.r,7);
        addParticles(m.x,m.y,m.color,48,1.35);
        makeFireField(m.x,m.y,m.fireR,m.fireLife,m.fireDps,m.color,m.impact);
        game.flash=0.30; game.flashColor=m.color; game.shake=18;
        game.meteors.splice(i,1);
      }
    }
    for(let i=game.fireFields.length-1;i>=0;i--){
      const f=game.fireFields[i];
      f.life-=dt; f.pulse+=dt*4.2;
      if(f.life<=0){game.fireFields.splice(i,1);continue}
      for(let j=game.enemies.length-1;j>=0;j--){

          e.hp-=f.dps*dt*game.upgrades.damage;
          e.hitFlash=Math.max(e.hitFlash||0,0.05);
          if(Math.random()<0.045) addParticles(e.x,e.y,f.color,1,0.22);
          if(e.hp<=0) enemyDeath(j,e);

      const s=game.rewindSparks[i]; s.life-=dt; if(s.life<=0) game.rewindSparks.splice(i,1);
    }
  };

  const _identityDrawHazards=drawHazards;

      const alpha=clamp(f.life/f.maxLife,0,1);
      const rr=f.r+Math.sin(f.pulse)*7;
      const g=ctx.createRadialGradient(f.x,f.y,8,f.x,f.y,rr);
      g.addColorStop(0,f.color+'77'); g.addColorStop(0.45,f.color+'35'); g.addColorStop(1,f.color+'00');
      ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f.x,f.y,rr,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=0.35*alpha; ctx.strokeStyle='#ffd2a0'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(f.x,f.y,rr,0,Math.PI*2); ctx.stroke();
    }
    for(const m of game.meteors||[]){

      const cx=m.fromX+(m.x-m.fromX)*k, cy=m.fromY+(m.y-m.fromY)*k;
      for(const t of m.tail){
        ctx.globalAlpha=clamp(t.life/t.maxLife,0,1)*0.35; ctx.fillStyle=m.color;

      ctx.beginPath();ctx.arc(cx,cy,18+Math.sin(game.time*20)*3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff0ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,m.y,m.r*(0.92+Math.sin(game.time*9)*0.03),0,Math.PI*2);ctx.stroke();
    }
    for(const s of game.rewindSparks||[]){
      ctx.globalAlpha=clamp(s.life/s.maxLife,0,1); ctx.fillStyle=s.color; ctx.shadowBlur=16; ctx.shadowColor=s.color;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }

  const _heroUpdateBullets=updateBullets;

  const _heroUpdateHazards=updateHazards;

// ── HOTFIX 1.4: MENU SAFE, MAPA MAIOR E BORDA ANTI-FUGA ─────────
(function(){
  const HOTFIX_VERSION='Chrono-Hero Hotfix 1.4';
  const EDGE_PAD=10;

  // Compra de personagens acontece antes do game existir. Estes wrappers impedem
  // erro de game === null quando algum efeito/txt é chamado no menu inicial.
  const _safeAddFloatingText=addFloatingText;
  addFloatingText=function(x,y,text,color='#fff',size=15){
    if(!game||!game.floatingTexts){
      if(typeof ECLIPSE_UPDATE!=='undefined'&&ECLIPSE_UPDATE.notices){
        ECLIPSE_UPDATE.notices.push({text:String(text||''),color,size,life:1.8,maxLife:1.8});
      }
      return;
    }
    return _safeAddFloatingText(x,y,text,color,size);
  };
  const _safeAddParticles=addParticles;
  addParticles=function(x,y,color,count,force=1){
    if(!game||!game.particles) return;
    return _safeAddParticles(x,y,color,count,force);
  };
  const _safeAddRing=addRing;
  addRing=function(x,y,color,maxR=40,width=3){
    if(!game||!game.rings) return;
    return _safeAddRing(x,y,color,maxR,width);
  };
  const _safeAddLightning=addLightning;
  addLightning=function(x1,y1,x2,y2,color='#7efff5'){
    if(!game||!game.lightnings) return;
    return _safeAddLightning(x1,y1,x2,y2,color);
  };

  // Mapa mais cheio: a tela agora é maior, então adicionamos cobertura extra
  // sem fechar demais o centro nem criar paredes injustas.
  const _hotfixMakeMapDecor=makeMapDecor;
  makeMapDecor=function(wave){
    const md=_hotfixMakeMapDecor(wave);
    md.obstacles=md.obstacles||[]; md.pads=md.pads||[]; md.lanes=md.lanes||[];
    const safeCenter=(x,y,w,h)=>Math.abs(x+w/2-W/2)<120&&Math.abs(y+h/2-H/2)<105;
    const tooClose=(x,y,w,h)=>md.obstacles.some(o=>Math.abs((x+w/2)-(o.x+o.w/2))<(w+o.w)/2+28&&Math.abs((y+h/2)-(o.y+o.h/2))<(h+o.h)/2+28);
    const add=(x,y,w,h,type='cover')=>{
      if(safeCenter(x,y,w,h)||tooClose(x,y,w,h)) return;
      md.obstacles.push({x,y,w,h,type,pulse:rand(0,Math.PI*2)});
    };
    const margin=56;
    add(W*0.18, H*0.24, 92, 28, 'sideCover');
    add(W*0.76, H*0.22, 92, 28, 'sideCover');
    add(W*0.18, H*0.72, 92, 28, 'sideCover');
    add(W*0.76, H*0.70, 92, 28, 'sideCover');
    if(wave>=2){ add(W*0.39, H*0.20, 34, 96, 'tower'); add(W*0.59, H*0.68, 34, 96, 'tower'); }
    if(wave>=5){ add(margin+30, H*0.28, 34, 126, 'edgePillar'); add(W-margin-64, H*0.56, 34, 126, 'edgePillar'); }
    if(wave>=9){ add(W*0.31, H*0.42, 72, 24, 'lowWall'); add(W*0.64, H*0.50, 72, 24, 'lowWall'); }
    if(wave>=14){ add(W*0.46, H*0.79, 110, 24, 'relicWall'); }
    // Pads novos ficam mais perto das bordas para aproveitar o mapa ampliado.
    if(!md.pads.some(p=>p.type==='dash')) md.pads.push({x:88,y:H-88,r:30,type:'dash',pulse:rand(0,Math.PI*2)});
    if(!md.pads.some(p=>p.type==='shield')) md.pads.push({x:W-88,y:88,r:30,type:'shield',pulse:rand(0,Math.PI*2)});
    return md;
  };

  // Reaplica o mapa novo imediatamente quando a wave muda/resetar.
  const _hotfixResetGame=resetGame;
  resetGame=function(classKey){
    _hotfixResetGame(classKey);
    if(game){game.mapDecor=makeMapDecor(game.wave||1); eclipseNotice('HOTFIX 1.4: mapa expandido e menu corrigido','#9bedff',14);}
  };
  const _hotfixStartNextWave=startNextWave;

  };

  function enemyInsideArena(e){
    return e.x>=e.r+EDGE_PAD&&e.x<=W-e.r-EDGE_PAD&&e.y>=e.r+EDGE_PAD&&e.y<=H-e.r-EDGE_PAD;
  }
  function clampEnemyBoundary(e){
    if(!e||e._dead) return;
    if(enemyInsideArena(e)) e._enteredArena=true;
    if(!e._enteredArena) return; // deixa spawnar fora e entrar naturalmente
    const minX=e.r+EDGE_PAD, maxX=W-e.r-EDGE_PAD, minY=e.r+EDGE_PAD, maxY=H-e.r-EDGE_PAD;
    if(e.x<minX){e.x=minX; if(e.vx<0)e.vx*=-0.35;}
    if(e.x>maxX){e.x=maxX; if(e.vx>0)e.vx*=-0.35;}
    if(e.y<minY){e.y=minY; if(e.vy<0)e.vy*=-0.35;}
    if(e.y>maxY){e.y=maxY; if(e.vy>0)e.vy*=-0.35;}
  }
  function applyEnemyBoundary(){

    for(const e of game.enemies) clampEnemyBoundary(e);
  }
  const _hotfixUpdateEnemies=updateEnemies;
  updateEnemies=function(dt){
    _hotfixUpdateEnemies(dt);
    applyEnemyBoundary();
  };

  // Visual de borda: indica que os monstros não podem sair depois que entraram.
  const _hotfixDrawGrid=drawGrid;
  drawGrid=function(){
    _hotfixDrawGrid();

    const theme=(game.mapDecor&&game.mapDecor.theme)||{accent:'#61dafb'};
    ctx.save();
    const pulse=0.32+Math.sin(game.time*2.4)*0.08;

    ctx.strokeStyle=theme.accent;
    ctx.lineWidth=3;
    ctx.shadowBlur=18;
    ctx.shadowColor=theme.accent;
    ctx.strokeRect(EDGE_PAD,EDGE_PAD,W-EDGE_PAD*2,H-EDGE_PAD*2);
    ctx.globalAlpha=0.12;
    ctx.lineWidth=10;
    ctx.strokeRect(EDGE_PAD+3,EDGE_PAD+3,W-(EDGE_PAD+3)*2,H-(EDGE_PAD+3)*2);
    ctx.restore();
  };

  // Pads novos: dash e shield com efeito leve.
  const _hotfixUpdatePlayer=updatePlayer;
  updatePlayer=function(dt){
    _hotfixUpdatePlayer(dt);
    if(!game||!game.player||!game.mapDecor||!game.mapDecor.pads) return;
    const p=game.player;
    for(const pad of game.mapDecor.pads){
      if((pad.type==='dash'||pad.type==='shield')&&dist(p,pad)<pad.r+p.r){
        if(pad.type==='dash') p.dashCharge=clamp(p.dashCharge+32*dt,0,100);
        if(pad.type==='shield') p.shield=clamp(p.shield+8*dt,0,p.maxShield);
      }
    }
  };

  const _hotfixDrawHazards=drawHazards;
  drawHazards=function(){
    _hotfixDrawHazards();
    if(!game||!game.mapDecor) return;
    ctx.save();
    for(const pad of game.mapDecor.pads||[]){
      if(pad.type!=='dash'&&pad.type!=='shield') continue;
      pad.pulse=(pad.pulse||0)+0.02;
      const col=pad.type==='dash'?'#ffd166':'#4ce0b3';
      const rr=pad.r+Math.sin(pad.pulse*3)*3;
      ctx.globalAlpha=0.24; ctx.fillStyle=col; ctx.shadowBlur=18; ctx.shadowColor=col;
      ctx.beginPath(); ctx.arc(pad.x,pad.y,rr,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=0.8; ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(pad.x,pad.y,rr,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=0.9; ctx.fillStyle='#06101d'; ctx.font='700 15px Rajdhani'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pad.type==='dash'?'DASH':'SHIELD',pad.x,pad.y);
    }
    ctx.restore();
  };
})();

  resetGame=function(classKey){
    _polishResetGame(classKey);
    ensurePolishState();
    if(game&&classKey==='chronoHero'){
      game.heroUltCharge=0;
      game.heroFlameStreams=[];
      eclipseNotice('CHRONO-HERO POLIDO: ultimate mais rara','#5fffee',14);
      updateHUD();
    }
  };

  const _polishUpdatePlayer=updatePlayer;
  updatePlayer=function(dt){
    const pre=(game&&game.classKey==='chronoHero')?Number(game.heroUltCharge||0):0;
    _polishUpdatePlayer(dt);
    if(game&&game.classKey==='chronoHero'&&!game.heroUltimate){
      // A versão anterior dava ~2% por segundo; agora fica perto de 0.35%/s.
      const post=Number(game.heroUltCharge||0);
      if(post>pre+dt*0.38) game.heroUltCharge=clamp(pre+dt*0.38,0,100);
    }
  };

  const _polishEnemyDeath=enemyDeath;
  enemyDeath=function(index,e){
    const track=game&&game.classKey==='chronoHero'&&e;
    const pre=track?Number(game.heroUltCharge||0):0;
    _polishEnemyDeath(index,e);
    if(track&&game&&game.classKey==='chronoHero'&&!game.heroUltimate){
      const desired=e.type==='boss'?18:(e.elite?4.2:2.0);
      const post=Number(game.heroUltCharge||0);
      if(post>pre+desired) game.heroUltCharge=clamp(pre+desired,0,100);
    }
  };

  function castPolishedFlame(){
    const p=game.player, a=angleTo(p,mouse);
    game.heroFlameStreams.push({
      x:p.x,y:p.y,ang:a,age:0,life:1.05,maxLife:1.05,
      range:305,width:0.43,dps:68,burnDps:13,color:'#ff8a35',seed:Math.random()*999
    });
    addRing(p.x+Math.cos(a)*42,p.y+Math.sin(a)*42,'#ffb347',58,4);
    addParticles(p.x+Math.cos(a)*24,p.y+Math.sin(a)*24,'#fff0a8',24,0.65);
    game.shake=7;
    eclipseNotice('LABAREDA ASCENDENTE','#ffb347',15);
  }
  function castPolishedIce(){
    const x=clamp(mouse.x,90,W-90), y=clamp(mouse.y,90,H-90);
    game.heroIceFields.push({x,y,r:210,life:7,maxLife:7,pulse:0,color:'#bffbff',frosty:true});
    addRing(x,y,'#eaffff',215,8);
    addRing(x,y,'#8ff5ff',150,4);
    addParticles(x,y,'#eaffff',62,0.9);
    game.flash=Math.max(game.flash,0.12); game.flashColor='#dffcff';
    eclipseNotice('GEADA ABSOLUTA: -50% velocidade','#dffcff',15);
  }
  function castPolishedBlackHole(){
    const x=clamp(mouse.x,75,W-75), y=clamp(mouse.y,75,H-75);
    game.heroBlackHoles.push({x,y,r:188,life:3,maxLife:3,pulse:0,dps:22,pull:372,color:'#8a5cff',exploded:false,polished:true});
    addRing(x,y,'#ffffff',76,5);
    addRing(x,y,'#8a5cff',188,5);
    addParticles(x,y,'#bda8ff',44,0.8);
    game.flash=0.16; game.flashColor='#8a5cff'; game.shake=10;
    eclipseNotice('SINGULARIDADE INSTÁVEL','#bda8ff',15);
  }

  const _polishUseSkill=useSkill;
  useSkill=function(idx){
    if(game&&game.classKey==='chronoHero'){
      const key=CLASSES[game.classKey].skills[idx];
      if(key==='heroIceField'){if(heroReadyPolish(idx,13)) castPolishedIce(); return;}
      if(key==='heroFlame'){if(heroReadyPolish(idx,10)) castPolishedFlame(); return;}
      if(key==='heroBlackHole'){if(heroReadyPolish(idx,18)) castPolishedBlackHole(); return;}
    }
    _polishUseSkill(idx);
  };

  // Tiros um pouco mais juntos e split controlado por esta versão.
  const _polishShoot=shoot;
  shoot=function(){
    if(game&&game.heroUltimate) return;
    if(!game||!game.running||game.classKey!=='chronoHero'){_polishShoot();return;}
    const p=game.player; if(p.fireCd>0) return;
    const base=angleTo(p,mouse), weapon=WEAPONS.heroSplit;
    for(const side of [-1,1]){
      const ang=base+side*0.085;
      const px=p.x+Math.cos(base+Math.PI/2)*side*6+Math.cos(ang)*21;
      const py=p.y+Math.sin(base+Math.PI/2)*side*6+Math.sin(ang)*21;
      game.bullets.push({x:px,y:py,vx:Math.cos(ang)*weapon.bulletSpeed,vy:Math.sin(ang)*weapon.bulletSpeed,r:5.2,life:weapon.life,damage:weapon.damage*game.upgrades.damage,pierce:game.upgrades.pierce,weaponKey:'heroSplit',explosive:false,identityColor:'#5fffee',heroSplitTimer2:0.48,heroSplitAng:ang});
    }
    p.fireCd=weapon.cooldown/game.upgrades.fireRate;
    addParticles(p.x+Math.cos(base)*20,p.y+Math.sin(base)*20,'#5fffee',9,0.45);
    if(Math.random()<0.65) addLightning(p.x,p.y,p.x+Math.cos(base)*38,p.y+Math.sin(base)*38,'#dfffff');
  };

  function splitHeroBulletPolish(index,b){
    const base=b.heroSplitAng??Math.atan2(b.vy,b.vx);
    for(const j of [-1,0,1]){
      const a=base+j*0.17;
      game.bullets.push({x:b.x,y:b.y,vx:Math.cos(a)*660,vy:Math.sin(a)*660,r:3.4,life:0.7,damage:b.damage*0.43,pierce:0,weaponKey:'heroSplitChild',explosive:false,identityColor:j===0?'#fff7b8':'#5fffee'});
    }
    addRing(b.x,b.y,'#5fffee',34,2);
    addParticles(b.x,b.y,'#fff7b8',10,0.48);
    game.bullets.splice(index,1);
  }

  const _polishUpdateBullets=updateBullets;
  updateBullets=function(dt){
    _polishUpdateBullets(dt);
    if(!game||!game.bullets) return;
    for(let i=game.bullets.length-1;i>=0;i--){
      const b=game.bullets[i];
      if(b.heroSplitTimer2!==undefined){
        b.heroSplitTimer2-=dt;
        if(b.heroSplitTimer2<=0&&game.bullets[i]===b) splitHeroBulletPolish(i,b);
      }
    }
  };

  function updatePolishFlames(dt){
    if(!game||!game.heroFlameStreams) return;
    for(let i=game.heroFlameStreams.length-1;i>=0;i--){
      const f=game.heroFlameStreams[i];
      f.age+=dt; f.life-=dt;
      const progress=easeOutCubic(f.age/f.maxLife);
      const reach=f.range*progress;
      const muzzle={x:f.x+Math.cos(f.ang)*22,y:f.y+Math.sin(f.ang)*22};

      for(let n=0;n<7;n++){
        const d=rand(24,Math.max(28,reach));
        const widen=(d/f.range)*46;
        const off=rand(-widen,widen);
        const x=muzzle.x+Math.cos(f.ang)*d+Math.cos(f.ang+Math.PI/2)*off;
        const y=muzzle.y+Math.sin(f.ang)*d+Math.sin(f.ang+Math.PI/2)*off;
        addParticles(x,y,Math.random()<0.45?'#fff0a8':(Math.random()<0.65?'#ffb347':'#ff5d2e'),1,0.38);
      }

      for(let j=game.enemies.length-1;j>=0;j--){
        const e=game.enemies[j];
        const d=dist(muzzle,e); if(d>reach+e.r||d<10) continue;
        if(Math.abs(angleDiffLocal(angleTo(muzzle,e),f.ang))>f.width) continue;
        if(typeof lineBlockedByMap==='function'&&lineBlockedByMap(muzzle,e,5)) continue;
        const heat=(1-d/(f.range+e.r));
        e.hp-=f.dps*heat*dt*game.upgrades.damage;
        e.hitFlash=Math.max(e.hitFlash||0,0.08);
        e.heroBurn=Math.max(e.heroBurn||0,3);
        e.heroBurnDps=Math.max(e.heroBurnDps||0,f.burnDps);
        if(Math.random()<0.18) addParticles(e.x,e.y,'#ff8a35',1,0.25);
        if(e.hp<=0) enemyDeath(j,e);
      }
      if(f.life<=0) game.heroFlameStreams.splice(i,1);
    }
  }

  function updatePolishUltimate(dt){
    if(!game||!game.heroUltimate||game.classKey!=='chronoHero') return;
    const u=game.heroUltimate, p=game.player;
    if(u.time>=u.beamStart&&u.time<=u.beamEnd){
      const origin={x:p.x,y:p.y};
      game.shake=Math.max(game.shake,34);
      for(let i=game.enemies.length-1;i>=0;i--){
        const e=game.enemies[i], info=beamInfoLocal(e,origin,u.ang);
        if(info.proj>-35&&info.proj<1380&&info.perp<92+e.r){
          // Borda extra do feixe grosso: menos forte que o núcleo antigo, mas agora pega uma largura maior.
          e.hp-=230*dt*game.upgrades.damage;
          e.hitFlash=Math.max(e.hitFlash||0,0.18);
          e.vx+=Math.cos(u.ang)*120*dt; e.vy+=Math.sin(u.ang)*120*dt;
          if(Math.random()<0.18) addLightning(p.x+Math.cos(u.ang)*rand(40,180),p.y+Math.sin(u.ang)*rand(40,180),e.x,e.y,u.colors[Math.floor(rand(0,u.colors.length))]);
          if(e.hp<=0) enemyDeath(i,e);
        }
      }
      for(let n=0;n<8;n++){
        const d=rand(80,1200), off=rand(-110,110);
        const x1=p.x+Math.cos(u.ang)*d+Math.cos(u.ang+Math.PI/2)*off;
        const y1=p.y+Math.sin(u.ang)*d+Math.sin(u.ang+Math.PI/2)*off;
        const x2=x1+Math.cos(u.ang+Math.PI/2)*rand(-95,95)+Math.cos(u.ang)*rand(40,120);
        const y2=y1+Math.sin(u.ang+Math.PI/2)*rand(-95,95)+Math.sin(u.ang)*rand(40,120);
        addLightning(x1,y1,x2,y2,u.colors[Math.floor(rand(0,u.colors.length))]);
        if(Math.random()<0.7) addParticles(x1,y1,u.colors[Math.floor(rand(0,u.colors.length))],2,0.7);
      }
      game.flash=Math.max(game.flash,0.09); game.flashColor='#ffffff';
    }
  }

  const _polishUpdateHazards=updateHazards;
  updateHazards=function(dt){
    _polishUpdateHazards(dt);
    ensurePolishState();
    updatePolishFlames(dt);
    updatePolishUltimate(dt);
  };

  const _polishDrawPlayer=drawPlayer;
  drawPlayer=function(){
    if(!game||game.classKey!=='chronoHero'){_polishDrawPlayer();return;}
    const p=game.player, a=angleTo(p,mouse), color=CLASSES[game.classKey].color, cloaked=game.cloakActive>0;
    const blink=p.hurtCd>0&&Math.floor(game.time*28)%2===0;
    ctx.save();
    if(p.trail){
      for(let i=p.trail.length-1;i>=0;i--){
        const tr=p.trail[i]; ctx.globalAlpha=(1-i/p.trail.length)*0.18;
        ctx.fillStyle=i%2?'#5fffee':'#ffffff'; ctx.beginPath(); ctx.arc(tr.x,tr.y,p.r*(1-i/p.trail.length)*0.95,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha=blink?0.28:(cloaked?0.3:1);
    ctx.translate(p.x,p.y); ctx.rotate(a);

    // Aura elétrica externa com faíscas instáveis.
    ctx.save();
    ctx.rotate(-a);
    for(let k=0;k<5;k++){
      const aa=game.time*4+k*Math.PI*2/5;
      const r1=p.r+18+Math.sin(game.time*9+k)*5;
      const r2=p.r+30+Math.cos(game.time*7+k)*6;
      ctx.globalAlpha=0.36;
      ctx.strokeStyle=k%2?'#5fffee':'#fff7b8'; ctx.lineWidth=1.6; ctx.shadowBlur=18; ctx.shadowColor=ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(Math.cos(aa)*r1,Math.sin(aa)*r1);
      ctx.lineTo(Math.cos(aa+0.16)*((r1+r2)/2),Math.sin(aa+0.16)*((r1+r2)/2));
      ctx.lineTo(Math.cos(aa+0.32)*r2,Math.sin(aa+0.32)*r2);
      ctx.stroke();
    }
    ctx.restore();

    if(p.shield>0){ctx.save();ctx.globalAlpha=(p.shield/p.maxShield)*0.42;ctx.strokeStyle='#5fffee';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,p.r+12,0,Math.PI*2);ctx.stroke();ctx.restore();}

    ctx.shadowBlur=34; ctx.shadowColor=color;
    ctx.beginPath();
    const spikes=14;
    for(let i=0;i<spikes*2;i++){
      const ang=-Math.PI/2+i*Math.PI/spikes;
      const rr=i%2===0?p.r+10:p.r-2;
      const sx=Math.cos(ang)*rr, sy=Math.sin(ang)*rr;
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    }
    ctx.closePath(); ctx.fillStyle='#07101d'; ctx.fill(); ctx.strokeStyle='#5fffee'; ctx.lineWidth=2.4; ctx.stroke();

    ctx.beginPath(); ctx.moveTo(4,-p.r-14); ctx.lineTo(18,-4); ctx.lineTo(4,0); ctx.closePath(); ctx.fillStyle='#fff7b8'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(4,p.r+14); ctx.lineTo(18,4); ctx.lineTo(4,0); ctx.closePath(); ctx.fillStyle='#ff6b9d'; ctx.fill();

    ctx.beginPath(); ctx.moveTo(-4,-8); ctx.lineTo(7,0); ctx.lineTo(-4,8); ctx.lineTo(-13,0); ctx.closePath();
    ctx.fillStyle='#ffffff'; ctx.shadowBlur=22; ctx.shadowColor='#ffffff'; ctx.fill();
    ctx.strokeStyle='#5fffee'; ctx.lineWidth=1.5; ctx.stroke();

    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(29,-7); ctx.lineTo(25,0); ctx.lineTo(29,7); ctx.closePath();
    ctx.fillStyle='#eaffff'; ctx.shadowBlur=18; ctx.shadowColor='#5fffee'; ctx.fill();
    ctx.restore();
  };

  function drawPolishEffects(){
    if(!game) return;
    ctx.save();
    ctx.globalCompositeOperation='lighter';

    for(const f of game.heroFlameStreams||[]){
      const progress=easeOutCubic(f.age/f.maxLife), reach=f.range*progress, fade=clamp(f.life/f.maxLife,0,1);
      const muzzle={x:f.x+Math.cos(f.ang)*20,y:f.y+Math.sin(f.ang)*20};
      for(let s=0;s<18;s++){
        const t=s/17, d=reach*t;
        const wave=Math.sin(game.time*18+s+f.seed)*18*t;
        const off=wave+Math.sin(s*2.2+f.seed)*12*t;
        const x=muzzle.x+Math.cos(f.ang)*d+Math.cos(f.ang+Math.PI/2)*off;
        const y=muzzle.y+Math.sin(f.ang)*d+Math.sin(f.ang+Math.PI/2)*off;
        const rr=(13+30*t)*(0.65+0.35*Math.sin(game.time*24+s))*fade;
        const g=ctx.createRadialGradient(x,y,1,x,y,Math.max(2,rr));
        g.addColorStop(0,'rgba(255,255,230,.95)');
        g.addColorStop(.34,'rgba(255,185,70,.72)');
        g.addColorStop(.72,'rgba(255,70,35,.35)');
        g.addColorStop(1,'rgba(255,40,10,0)');
        ctx.globalAlpha=0.72*fade*(1-t*0.25); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.fill();
      }
    }

    for(const f of game.heroIceFields||[]){
      if(!f.frosty) continue;
      const a=clamp(f.life/f.maxLife,0,1), rr=f.r+Math.sin(game.time*4)*6;
      ctx.globalAlpha=0.20*a; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.4; ctx.shadowBlur=22; ctx.shadowColor='#dffcff';
      for(let k=0;k<14;k++){
        const ang=k*Math.PI*2/14+Math.sin(game.time*0.6)*0.2;
        ctx.beginPath(); ctx.moveTo(f.x+Math.cos(ang)*22,f.y+Math.sin(ang)*22); ctx.lineTo(f.x+Math.cos(ang)*rr,f.y+Math.sin(ang)*rr); ctx.stroke();
        const bx=f.x+Math.cos(ang)*rr*0.72, by=f.y+Math.sin(ang)*rr*0.72;
        ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+Math.cos(ang+0.75)*22,by+Math.sin(ang+0.75)*22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+Math.cos(ang-0.75)*22,by+Math.sin(ang-0.75)*22); ctx.stroke();
      }
      ctx.globalAlpha=0.18*a; ctx.fillStyle='rgba(235,255,255,.85)';
      for(let s=0;s<22;s++){
        const ang=s*2.399+game.time*0.25, rad=(s*37%f.r);
        ctx.beginPath(); ctx.arc(f.x+Math.cos(ang)*rad,f.y+Math.sin(ang)*rad,1.4+(s%3),0,Math.PI*2); ctx.fill();
      }
    }

    for(const h of game.heroBlackHoles||[]){
      if(!h.polished) continue;
      const a=clamp(h.life/h.maxLife,0,1);
      ctx.globalAlpha=.32*a; ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.shadowBlur=30; ctx.shadowColor='#8a5cff';
      for(let k=0;k<6;k++){
        ctx.beginPath();
        ctx.ellipse(h.x,h.y,h.r*(0.32+k*.11),h.r*(0.08+k*.022),h.pulse*.45+k*Math.PI/6,0,Math.PI*2);
        ctx.stroke();
      }
      ctx.globalAlpha=.24*a; ctx.strokeStyle='#ff6bff'; ctx.lineWidth=1.3;
      for(let k=0;k<8;k++){
        const ang=game.time*2+k*Math.PI*2/8;
        ctx.beginPath(); ctx.moveTo(h.x+Math.cos(ang)*h.r*.55,h.y+Math.sin(ang)*h.r*.55); ctx.quadraticCurveTo(h.x+Math.cos(ang+0.5)*h.r*.8,h.y+Math.sin(ang+0.5)*h.r*.8,h.x+Math.cos(ang+1.1)*h.r*.35,h.y+Math.sin(ang+1.1)*h.r*.35); ctx.stroke();
      }
    }

    if(game.heroUltimate&&game.classKey==='chronoHero'){
      const u=game.heroUltimate,p=game.player;
      if(u.time>=u.beamStart&&u.time<=u.beamEnd){
        const len=1450, ex=p.x+Math.cos(u.ang)*len, ey=p.y+Math.sin(u.ang)*len;
        const grad=ctx.createLinearGradient(p.x,p.y,ex,ey);
        grad.addColorStop(0,'rgba(255,255,255,1)'); grad.addColorStop(.16,'rgba(95,255,238,.96)'); grad.addColorStop(.38,'rgba(255,209,102,.92)'); grad.addColorStop(.65,'rgba(255,107,255,.72)'); grad.addColorStop(1,'rgba(95,255,238,0)');
        const w=142+Math.sin(game.time*44)*18;
        ctx.globalAlpha=.86; ctx.strokeStyle=grad; ctx.lineWidth=w; ctx.lineCap='round'; ctx.shadowBlur=70; ctx.shadowColor='#ffffff'; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ex,ey); ctx.stroke();
        ctx.globalAlpha=.98; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=42+Math.sin(game.time*60)*7; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ex,ey); ctx.stroke();
        for(let k=0;k<10;k++){
          const d=rand(50,1250), off=rand(-125,125);
          const sx=p.x+Math.cos(u.ang)*d+Math.cos(u.ang+Math.PI/2)*off;
          const sy=p.y+Math.sin(u.ang)*d+Math.sin(u.ang+Math.PI/2)*off;
          ctx.globalAlpha=.72; ctx.strokeStyle=u.colors[k%u.colors.length]; ctx.lineWidth=2.2; ctx.shadowBlur=22; ctx.shadowColor=ctx.strokeStyle;
          ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(u.ang+Math.PI/2)*rand(-90,90)+Math.cos(u.ang)*rand(50,130),sy+Math.sin(u.ang+Math.PI/2)*rand(-90,90)+Math.sin(u.ang)*rand(50,130)); ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  const _polishRender=render;
  render=function(){_polishRender();drawPolishEffects();};

  console.log(POLISH_VERSION+' carregado');
})();

  function rawMeta(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')||{}}catch{return {}}}
  function writeMeta(m){localStorage.setItem(SAVE_KEY,JSON.stringify(m||{}));}
  function getRelics(){const a=rawMeta(); return Number(a.relicShards||0)}
  function addRelics(n){const m=rawMeta(); m.relicShards=Number(m.relicShards||0)+n; writeMeta(m); if(game&&game.meta) game.meta.relicShards=m.relicShards; return m.relicShards;}
  function spendRelics(n){const m=rawMeta(); const have=Number(m.relicShards||0); if(have<n) return false; m.relicShards=have-n; writeMeta(m); if(game&&game.meta) game.meta.relicShards=m.relicShards; return true;}
  function readUnlocks(){try{const arr=JSON.parse(localStorage.getItem(CLASS_UNLOCK_KEY)||'[]'); return Array.from(new Set(FREE_CLASSES.concat(Array.isArray(arr)?arr:[])));}catch{return [...FREE_CLASSES]}}
  function writeUnlocks(arr){localStorage.setItem(CLASS_UNLOCK_KEY,JSON.stringify(Array.from(new Set((arr||[]).filter(Boolean)))))}
  function isUnlocked(k){return FREE_CLASSES.includes(k)||readUnlocks().includes(k)}
  function orderedClasses(){return CLASS_ORDER.filter(k=>CLASSES[k]).concat(Object.keys(CLASSES).filter(k=>!CLASS_ORDER.includes(k)));}
  function redeemed(){try{const arr=JSON.parse(localStorage.getItem(REDEEM_KEY)||'[]'); return Array.isArray(arr)?arr:[]}catch{return []}}
  function writeRedeemed(arr){localStorage.setItem(REDEEM_KEY,JSON.stringify(Array.from(new Set(arr||[]))))}
  function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

      const total=addRelics(CODE_REWARDS[key]);

  function drawFocusUnderPlayer(){
    if(!game||!game.player) return;
    const p=game.player;
    if(p.focus>=p.maxFocus-0.4) return;
    const pct=clamp(p.focus/p.maxFocus,0,1), bw=62, bh=7, x=p.x-bw/2, y=p.y+p.r+18;
    ctx.save();
    ctx.globalAlpha=0.92;
    ctx.fillStyle='rgba(4,5,14,.78)'; ctx.fillRect(x-2,y-2,bw+4,bh+4);
    ctx.strokeStyle='rgba(225,220,255,.55)'; ctx.lineWidth=1; ctx.strokeRect(x-2.5,y-2.5,bw+5,bh+5);
    const grad=ctx.createLinearGradient(x,y,x+bw,y); grad.addColorStop(0,'#7c3cff'); grad.addColorStop(.55,'#c6a0ff'); grad.addColorStop(1,'#ffffff');
    ctx.fillStyle=grad; ctx.fillRect(x,y,bw*pct,bh);
    ctx.shadowBlur=12; ctx.shadowColor='#c6a0ff'; ctx.strokeStyle='#c6a0ff'; ctx.strokeRect(x,y,bw*pct,bh);
    ctx.restore();
  }
  const _uiRender=render;

  function weightedChoices(pool,count){
    const chosen=[], bag=[...pool];
    while(chosen.length<count&&bag.length){
      const total=bag.reduce((s,it)=>s+(it.weight||1),0);
      let roll=Math.random()*total, idx=0;
      for(;idx<bag.length;idx++){roll-=bag[idx].weight||1;if(roll<=0)break;}
      chosen.push(bag.splice(Math.min(idx,bag.length-1),1)[0]);
    }
    return chosen;
  }

// ── WALL & PROJECTILE FIX 1.7: HITBOX PRECISA + TODOS PROJÉTEIS BLOQUEADOS ──
(function(){
  const WALL_PATCH_VERSION='Wall & Projectile Fix 1.7';

  function preciseObstacleBody(o){
    // A parede é desenhada com roundRect e brilho. Para os tiros, usamos só o corpo visual real,
    // sem a “aura”/sombra e sem inflar demais a hitbox nas quinas.
    const inset=Math.min(4, Math.max(2, Math.min(o.w,o.h)*0.10));
    return {x:o.x+inset,y:o.y+inset,w:Math.max(4,o.w-inset*2),h:Math.max(4,o.h-inset*2),r:Math.min(8,Math.max(3,Math.min(o.w,o.h)*0.22))};
  }
  function signedDistanceRoundedRect(px,py,rect,expand=0){
    const x=rect.x-expand, y=rect.y-expand, w=rect.w+expand*2, h=rect.h+expand*2;
    const radius=Math.max(0,rect.r+expand);
    const cx=x+w/2, cy=y+h/2;
    const bx=Math.max(0,w/2-radius), by=Math.max(0,h/2-radius);
    const qx=Math.abs(px-cx)-bx, qy=Math.abs(py-cy)-by;
    const outside=Math.hypot(Math.max(qx,0),Math.max(qy,0));
    const inside=Math.min(Math.max(qx,qy),0);
    return outside+inside-radius;
  }
  function pointHitsObstacleForProjectile(px,py,o,rad){
    return signedDistanceRoundedRect(px,py,preciseObstacleBody(o),rad)<=0;
  }
  function bboxTouchesObstacle(x1,y1,x2,y2,o,rad){
    const b=preciseObstacleBody(o), pad=rad+2;
    const minX=Math.min(x1,x2), maxX=Math.max(x1,x2), minY=Math.min(y1,y2), maxY=Math.max(y1,y2);
    return !(maxX<b.x-pad||minX>b.x+b.w+pad||maxY<b.y-pad||minY>b.y+b.h+pad);
  }
  function segmentHitsObstaclePrecise(x1,y1,x2,y2,o,rad){
    if(!bboxTouchesObstacle(x1,y1,x2,y2,o,rad)) return false;
    const len=Math.hypot(x2-x1,y2-y1);
    const steps=Math.max(2,Math.ceil(len/5));
    for(let s=0;s<=steps;s++){
      const t=s/steps;
      const x=x1+(x2-x1)*t, y=y1+(y2-y1)*t;
      if(pointHitsObstacleForProjectile(x,y,o,rad)) return true;
    }
    return false;
  }
  function projectileWallRadius(obj,extra=0){
    // Antes a colisão usava o raio inteiro do projétil + expansão retangular.
    // Isso fazia a parede parecer maior do que o desenho. Agora o raio é menor e a quina é arredondada.
    return clamp((obj?.r||3)*0.55+extra*0.25,1.1,4.8);
  }
  function mapSegmentBlockedPrecise(x1,y1,x2,y2,rad=1.5){
    if(!game||!game.mapDecor||!game.mapDecor.obstacles) return false;
    for(const o of game.mapDecor.obstacles){
      if(segmentHitsObstaclePrecise(x1,y1,x2,y2,o,rad)) return true;
    }
    return false;
  }

  // Substitui a colisão antiga para tiros/linha de visão por uma versão que casa melhor com o visual.
  shotBlockedByMap=function(oldX,oldY,obj,extra=0){
    if(!obj||obj.ignoreWalls||obj.wallPierce||obj.ultimateBeam) return false;
    return mapSegmentBlockedPrecise(oldX,oldY,obj.x,obj.y,projectileWallRadius(obj,extra));
  };
  lineBlockedByMap=function(a,b,extra=0){
    if(!a||!b) return false;
    return mapSegmentBlockedPrecise(a.x,a.y,b.x,b.y,clamp(extra*0.18+1.2,1.2,3.2));
  };

  function isSniperCloakedNow(){return game&&game.classKey==='sniper'&&game.cloakActive>0;}
  function isInsideHeroIceField(obj){
    return !!(game&&game.heroIceFields&&game.heroIceFields.some(f=>f.life>0&&dist(obj,f)<f.r+(obj.r||0)));
  }
  function splitOracleProjectile(i,b){
    const base=Math.atan2(b.vy,b.vx), count=8;
    for(let n=0;n<count;n++){
      const a=base+(Math.PI*2/count)*n;
      game.enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*250,vy:Math.sin(a)*250,r:5.5,life:2.7,damage:8,color:'#e7ff9f',homing:false,fromBoss:true});
    }
    addRing(b.x,b.y,'#d8ff8a',58,3); addParticles(b.x,b.y,'#d8ff8a',16,0.65);
    game.enemyBullets.splice(i,1);
  }

  // Reescreve só a movimentação dos projéteis inimigos para TODOS baterem na parede.
  // Exceções pedidas: cura do médico não é projétil; ultimate do Chrono-Hero não usa enemyBullets.
  updateEnemyBullets=function(dt){
    if(!game||!game.enemyBullets||!game.player) return;
    if(game.heroUltimate) return;
    const p=game.player;

    if(game.parryTimer>0){
      for(let i=game.enemyBullets.length-1;i>=0;i--){
        const b=game.enemyBullets[i];
        if(dist(b,p)<72){
          let target=null,minD=620;
          for(const e of game.enemies){const d=dist(p,e);if(d<minD&&!lineBlockedByMap(p,e,2)){minD=d;target=e;}}
          const a=target?angleTo(p,target):angleTo(p,mouse);
          game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:4,life:0.9,damage:20*game.upgrades.damage,pierce:1,weaponKey:'rail',explosive:false,identityColor:'#ffe38c'});
          addLightning(p.x,p.y,b.x,b.y,'#ffe38c'); game.enemyBullets.splice(i,1); game.shake=5;
        }
      }
    }

    for(let i=game.enemyBullets.length-1;i>=0;i--){
      const b=game.enemyBullets[i];
      if(!b) continue;
      if(b.oracleSplitTimer!==undefined){
        b.oracleSplitTimer-=dt;
        if(b.oracleSplitTimer<=0){splitOracleProjectile(i,b);continue;}
      }

      const oldX=b.x, oldY=b.y;
      const slow=isInsideHeroIceField(b)?0.5:1;
      if(slow<1&&Math.random()<0.08) addParticles(b.x,b.y,'#dffcff',1,0.12);

      if(isSniperCloakedNow()&&!b.fromBoss){
        b._cloakWanderCd=(b._cloakWanderCd||0)-dt;
        if(b._cloakWanderCd<=0||b._cloakWanderAng===undefined){b._cloakWanderAng=rand(0,Math.PI*2);b._cloakWanderCd=rand(0.25,0.75)}
        const sp=Math.max(120,Math.hypot(b.vx,b.vy)||190);
        b.vx+=(Math.cos(b._cloakWanderAng)*sp-b.vx)*dt*3.2;
        b.vy+=(Math.sin(b._cloakWanderAng)*sp-b.vy)*dt*3.2;
      }else if(b.homing&&game.timeStopActive<=0){
        const a=angleTo(b,p);
        b.vx+=(Math.cos(a)*300-b.vx)*dt*1.5;
        b.vy+=(Math.sin(a)*300-b.vy)*dt*1.5;
      }

      b.x+=b.vx*dt*slow; b.y+=b.vy*dt*slow; b.life-=dt;

      if(shotBlockedByMap(oldX,oldY,b,0)){
        addParticles(b.x,b.y,b.color||'#9bedff',7,0.28);
        addRing(b.x,b.y,b.color||'#9bedff',18,2);
        game.enemyBullets.splice(i,1); continue;
      }
      if(b.life<=0||b.x<-44||b.x>W+44||b.y<-44||b.y>H+44){game.enemyBullets.splice(i,1);continue;}
      if(circleCollide(b,p)&&p.hurtCd<=0&&p.dashTime<=0){dealDamageToPlayer(b.damage);game.enemyBullets.splice(i,1);}
    }
  };

  function heroSkillPayFix(idx,cd){
    if(!game||!game.running||game.classKey!=='chronoHero') return false;
    const key=CLASSES[game.classKey].skills[idx], sk=SKILL_DEFS[key], p=game.player;
    if(!sk||game.skillCds[idx]>0||p.focus<sk.focusCost||game.heroUltimate) return false;
    p.focus-=sk.focusCost; game.skillCds[idx]=cd??sk.cooldown; return true;
  }
  const _wallFixUseSkill=useSkill;
  useSkill=function(idx){
    if(game&&game.classKey==='chronoHero'){
      const key=CLASSES[game.classKey].skills[idx];
      if(key==='heroFlame'){
        if(heroSkillPayFix(idx,10)){
          const p=game.player,a=angleTo(p,mouse);
          game.heroFlameStreams=game.heroFlameStreams||[];
          // Mais largo para os lados, porém com alcance menor para cumprir a mudança pedida.
          game.heroFlameStreams.push({x:p.x,y:p.y,ang:a,age:0,life:1.18,maxLife:1.18,range:345,width:0.92,dps:80,burnDps:16,color:'#ff8a35',seed:Math.random()*999,wideFlame:true});
          addRing(p.x+Math.cos(a)*48,p.y+Math.sin(a)*48,'#ffb347',96,5);
          addParticles(p.x+Math.cos(a)*25,p.y+Math.sin(a)*25,'#fff0a8',42,0.82);
          game.shake=10;
          if(typeof eclipseNotice==='function') eclipseNotice('LABAREDA LATERAL','#ffb347',16);
        }
        return;
      }
    }
    _wallFixUseSkill(idx);
  };

  function drawWideFlameFix(){
    if(!game||!game.heroFlameStreams) return;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(const f of game.heroFlameStreams){
      if(!f.wideFlame) continue;
      const progress=1-Math.pow(1-clamp(f.age/f.maxLife,0,1),3);
      const reach=f.range*progress, fade=clamp(f.life/f.maxLife,0,1);
      const muzzle={x:f.x+Math.cos(f.ang)*18,y:f.y+Math.sin(f.ang)*18};
      for(let s=0;s<16;s++){
        const t=(s+1)/16, d=reach*t;
        for(const side of [-1,1]){
          const off=side*(18+70*t)*Math.sin(0.65+s*0.41+f.seed);
          const x=muzzle.x+Math.cos(f.ang)*d+Math.cos(f.ang+Math.PI/2)*off;
          const y=muzzle.y+Math.sin(f.ang)*d+Math.sin(f.ang+Math.PI/2)*off;
          const rr=(18+38*t)*fade;
          const g=ctx.createRadialGradient(x,y,1,x,y,Math.max(2,rr));
          g.addColorStop(0,'rgba(255,255,235,.95)');
          g.addColorStop(.38,'rgba(255,183,72,.70)');
          g.addColorStop(.78,'rgba(255,70,30,.30)');
          g.addColorStop(1,'rgba(255,30,0,0)');
          ctx.globalAlpha=0.46*fade; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.fill();
        }
      }
    }
    ctx.restore();
  }
  const _wallFixRender=render;
  render=function(){_wallFixRender();drawWideFlameFix();};

  console.log(WALL_PATCH_VERSION+' carregado');
})();


openStartMenu();
requestAnimationFrame(loop);
</script>
