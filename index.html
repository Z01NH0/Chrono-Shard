<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONO SHARDS — Eclipse Update</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif;color:#eef2ff}

#bg-canvas{position:fixed;inset:0;z-index:0}

.game-shell{width:100%;height:100%;display:grid;place-items:center;position:relative;z-index:1}

canvas#game{
  width:min(98vw,1320px);height:auto;aspect-ratio:1360/780;
  border-radius:16px;border:1px solid rgba(120,200,255,0.15);
  background:transparent;
  box-shadow:0 0 80px rgba(80,140,255,0.12),inset 0 0 40px rgba(0,0,0,0.6);
  position:relative;z-index:2;cursor:none
}

.hud{
  position:absolute;top:12px;width:min(98vw,1320px);
  display:flex;justify-content:space-between;gap:12px;
  pointer-events:none;z-index:5
}

.left-panel,.right-panel{display:flex;flex-direction:column;gap:8px}

.title{
  font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;
  letter-spacing:0.18em;
  background:linear-gradient(90deg,#61dafb,#9f6cff,#ff6b9d);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 12px rgba(97,218,251,0.4))
}

.stats,.scoreboard{
  background:rgba(6,8,18,0.85);
  border:1px solid rgba(120,200,255,0.12);
  backdrop-filter:blur(14px);
  border-radius:14px;padding:12px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4)
}

.stats{min-width:300px;display:grid;gap:8px}
.stats>div{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;font-size:11px;letter-spacing:0.1em;font-weight:600}

.bar{height:8px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:100%;border-radius:inherit;transition:width 0.1s linear}

#hpBar{background:linear-gradient(90deg,#ff4d6d,#ff8fa3);box-shadow:0 0 10px rgba(255,77,109,0.5)}
#focusBar{background:linear-gradient(90deg,#46d6ff,#9bedff);box-shadow:0 0 10px rgba(70,214,255,0.5)}
#dashBar{background:linear-gradient(90deg,#ffd166,#ffe999);box-shadow:0 0 10px rgba(255,209,102,0.5)}
#xpBar{background:linear-gradient(90deg,#9f6cff,#d4a0ff);box-shadow:0 0 10px rgba(159,108,255,0.5)}
#shieldBar{background:linear-gradient(90deg,#4ce0b3,#9ef5d8);box-shadow:0 0 10px rgba(76,224,179,0.5)}

.scoreboard{min-width:200px;display:grid;gap:6px;font-size:13px}
.scoreboard b{color:#7dcfff;font-weight:700}
.scoreboard .combo-counter{font-size:16px;font-weight:700;color:#ffd166;letter-spacing:0.08em}

.wave-announce{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Orbitron',sans-serif;font-size:48px;font-weight:900;
  color:#fff;pointer-events:none;z-index:10;text-align:center;
  text-shadow:0 0 40px rgba(97,218,251,0.8),0 0 80px rgba(159,108,255,0.5);
  opacity:0;transition:none
}

.skill-bar{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;z-index:5;pointer-events:none
}

.skill-icon{
  width:50px;height:50px;border-radius:12px;
  background:rgba(6,8,18,0.9);border:1px solid rgba(120,200,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;position:relative;flex-direction:column
}

.skill-icon .cd-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.7);border-radius:inherit;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;letter-spacing:0.05em
}

.skill-icon .key-hint{
  position:absolute;bottom:-18px;font-size:10px;
  color:rgba(200,220,255,0.6);letter-spacing:0.05em
}

.mini-action-btn{
  border:none;border-radius:999px;padding:8px 14px;
  font:inherit;font-weight:700;cursor:pointer;color:#09101d;font-size:12px;
  background:linear-gradient(135deg,#ffd166,#fff0b3);
  box-shadow:0 6px 20px rgba(255,209,102,0.3);
  transition:transform 0.15s,filter 0.15s;pointer-events:all
}
.mini-action-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}

.weapon-return-wrap{
  position:absolute;bottom:14px;
  right:max(1vw,calc((100vw - min(98vw,1320px))/2 + 10px));
  z-index:6
}

.overlay{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(2,4,10,0.6);backdrop-filter:blur(10px);z-index:8
}
.overlay.hidden{display:none}

.card{
  width:min(92vw,880px);
  background:rgba(8,11,22,0.98);
  border:1px solid rgba(120,200,255,0.15);
  border-radius:24px;padding:28px;text-align:center;
  box-shadow:0 0 80px rgba(97,218,251,0.08),0 24px 80px rgba(0,0,0,0.5);
  max-height:90vh;overflow-y:auto
}

.card h1{
  margin:0 0 8px;font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;
  background:linear-gradient(135deg,#61dafb,#9f6cff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent
}

.card p{margin:0 0 16px;line-height:1.7;color:#b0c4e8;font-size:15px}

.pick-grid,.shop-grid,.upgrade-grid,.relic-grid{display:grid;gap:10px;margin-top:16px}
.pick-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.relic-grid,.shop-grid,.upgrade-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

button{border:none;border-radius:14px;cursor:pointer;font:inherit;font-weight:700;transition:transform 0.15s,filter 0.15s,box-shadow 0.15s}
button:hover{transform:translateY(-2px) scale(1.015);filter:brightness(1.08)}

.main-btn{
  padding:13px 28px;border-radius:999px;
  background:linear-gradient(135deg,#61dafb,#7c8cff);
  color:#06101d;font-size:15px;
  box-shadow:0 10px 28px rgba(97,218,251,0.25)
}

.pick-btn,.shop-btn,.upgrade-btn,.relic-btn{
  text-align:left;padding:14px 16px;
  background:linear-gradient(135deg,rgba(97,218,251,0.12),rgba(159,108,255,0.12));
  border:1px solid rgba(97,218,251,0.25);color:#e8f4ff
}
.pick-btn:hover,.shop-btn:hover,.upgrade-btn:hover,.relic-btn:hover{
  background:linear-gradient(135deg,rgba(97,218,251,0.22),rgba(159,108,255,0.22));
  box-shadow:0 0 20px rgba(97,218,251,0.15)
}

.pick-btn strong,.shop-btn strong,.upgrade-btn strong,.relic-btn strong{
  display:block;margin-bottom:4px;font-size:15px;color:#e8f4ff
}
.pick-btn span,.shop-btn span,.upgrade-btn span,.relic-btn span{
  display:block;font-size:12px;opacity:0.8;line-height:1.4;color:#9fbdd8
}

.class-tag{
  display:inline-block;padding:2px 8px;border-radius:6px;
  font-size:10px;font-weight:700;margin-top:6px;letter-spacing:0.08em
}

.muted{opacity:0.65;font-size:12px;margin-top:8px}
.tipline{margin-top:14px;font-size:11px;opacity:0.65}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="game-shell">
  <div class="hud">
    <div class="left-panel">
      
      <div class="stats">
        <div><span>HP</span><div class="bar"><i id="hpBar"></i></div></div>
        <div><span>ESCUDO</span><div class="bar"><i id="shieldBar"></i></div></div>
        <div><span>FOCO</span><div class="bar"><i id="focusBar"></i></div></div>
        <div><span>DASH</span><div class="bar"><i id="dashBar"></i></div></div>
        <div><span>XP</span><div class="bar"><i id="xpBar"></i></div></div>
      </div>
    </div>
    <div class="right-panel">
      <div class="scoreboard">
        <div>Classe: <b id="classLabel">-</b></div>
        <div>Arma: <b id="weaponLabel">-</b></div>
        <div>Score: <b id="score">0</b></div>
        <div>Wave: <b id="wave">1</b></div>
        <div>Kills: <b id="kills">0</b></div>
        <div>Level: <b id="level">1</b></div>
        <div>Ouro: <b id="gold">0</b></div>
        <div>Combo: <span class="combo-counter" id="comboEl">x1</span></div>
      </div>
    </div>
  </div>

  <div class="skill-bar" id="skillBar">
    <div class="skill-icon" id="skillIcon1">
      <span id="skillEmoji1">⚡</span>
      <div class="cd-overlay" id="skillCd1" style="display:none">0.0</div>
      <span class="key-hint">E</span>
    </div>
    <div class="skill-icon" id="skillIcon2">
      <span id="skillEmoji2">🛡️</span>
      <div class="cd-overlay" id="skillCd2" style="display:none">0.0</div>
      <span class="key-hint">Q</span>
    </div>
    <div class="skill-icon" id="skillIcon3">
      <span id="skillEmoji3">🌀</span>
      <div class="cd-overlay" id="skillCd3" style="display:none">0.0</div>
      <span class="key-hint">R</span>
    </div>
  </div>

  <canvas id="game" width="1360" height="780"></canvas>

  <div class="weapon-return-wrap">
    <button id="returnWeaponBtn" class="mini-action-btn">↺ Arma Inicial</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="card" id="overlayCard"></div>
  </div>
</div>

<script>
// ── BG STARS ──────────────────────────────────────────────────
const bgC = document.getElementById('bg-canvas');
const bgX = bgC.getContext('2d');
bgC.width = window.innerWidth; bgC.height = window.innerHeight;
const stars = Array.from({length:200},()=>({
  x:Math.random()*bgC.width, y:Math.random()*bgC.height,
  r:Math.random()*1.5+0.3, t:Math.random()*Math.PI*2,
  sp:Math.random()*0.02+0.005
}));
function drawBG(){
  bgX.clearRect(0,0,bgC.width,bgC.height);
  const g=bgX.createRadialGradient(bgC.width/2,bgC.height/2,80,bgC.width/2,bgC.height/2,Math.max(bgC.width,bgC.height)*0.7);
  g.addColorStop(0,'#0a0d1e'); g.addColorStop(1,'#020408');
  bgX.fillStyle=g; bgX.fillRect(0,0,bgC.width,bgC.height);
  for(const s of stars){
    s.t+=s.sp; const a=0.3+Math.sin(s.t)*0.3;
    bgX.globalAlpha=a; bgX.fillStyle='#a0c4ff';
    bgX.beginPath(); bgX.arc(s.x,s.y,s.r,0,Math.PI*2); bgX.fill();
  }
  bgX.globalAlpha=1; requestAnimationFrame(drawBG);
}
drawBG();

// ── CORE ────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayCard = document.getElementById('overlayCard');

const hpBar = document.getElementById('hpBar');
const shieldBar = document.getElementById('shieldBar');
const focusBar = document.getElementById('focusBar');
const dashBar = document.getElementById('dashBar');
const xpBar = document.getElementById('xpBar');
const scoreEl = document.getElementById('score');
const waveEl = document.getElementById('wave');
const killsEl = document.getElementById('kills');
const levelEl = document.getElementById('level');
const goldEl = document.getElementById('gold');
const comboEl = document.getElementById('comboEl');
const classLabel = document.getElementById('classLabel');
const weaponLabel = document.getElementById('weaponLabel');
const returnWeaponBtn = document.getElementById('returnWeaponBtn');
const skillBar = document.getElementById('skillBar');

const W = canvas.width, H = canvas.height;
const keys = {};
const mouse = {x:W/2, y:H/2, down:false};
let game = null, last = 0;
const SAVE_KEY = 'chrono_v4_meta';

// ── CLASSES ─────────────────────────────────────────────────────
const CLASSES = {
  assault:{
    name:'Assault 🔫', color:'#7fe9ff', hp:130, shield:30,
    focus:100, speed:295, weapon:'blaster',
    skills:['shockwave','energyShield','grenadeStorm'],
    desc:'Equilibrada. Resistente. Perigosa em grupo.',
    tag:'VERSÁTIL', tagColor:'#61dafb'
  },
  sniper:{
    name:'Sniper 🎯', color:'#ffe38c', hp:90, shield:15,
    focus:120, speed:265, weapon:'rail',
    skills:['pierceMode','cloakDash','timeStop'],
    desc:'Um tiro, um kill. Ou vários com pierce mode.',
    tag:'PRECISÃO', tagColor:'#ffd166'
  },
  mage:{
    name:'Void Mage 🧙', color:'#c6a0ff', hp:100, shield:20,
    focus:160, speed:305, weapon:'orb',
    skills:['blinkBurst','voidNova','temporalLoop'],
    desc:'Teletransporte, explosões e física duvidosa.',
    tag:'MOBILIDADE', tagColor:'#c6a0ff'
  },
  reaper:{
    name:'Reaper ⚔️', color:'#ff7b9c', hp:115, shield:25,
    focus:90, speed:315, weapon:'shotgun',
    skills:['deathMark','soulDrain','phantomStrike'],
    desc:'CQC brutal. Quanto mais mata, mais forte fica.',
    tag:'AGRESSIVO', tagColor:'#ff6b9d'
  }
};

// ── WEAPONS ─────────────────────────────────────────────────────
const WEAPONS = {
  blaster:{name:'Blaster',cooldown:0.13,bulletSpeed:580,damage:14,spread:0.10,projectiles:1,life:1.1},
  shotgun:{name:'Shotgun',cooldown:0.38,bulletSpeed:460,damage:12,spread:0.22,projectiles:5,life:0.55},
  rail:{name:'Rail Gun',cooldown:0.52,bulletSpeed:880,damage:38,spread:0.01,projectiles:1,life:0.75},
  orb:{name:'Void Orb',cooldown:0.20,bulletSpeed:370,damage:17,spread:0.04,projectiles:1,life:1.4},
  plasma:{name:'Plasma',cooldown:0.25,bulletSpeed:420,damage:20,spread:0.08,projectiles:2,life:1.0},
  chainsaw:{name:'Chainsaw',cooldown:0.08,bulletSpeed:320,damage:8,spread:0.18,projectiles:1,life:0.5},
  minigun:{name:'Minigun',cooldown:0.06,bulletSpeed:500,damage:7,spread:0.25,projectiles:1,life:0.8},
  cannon:{name:'Cannon',cooldown:0.80,bulletSpeed:600,damage:65,spread:0.03,projectiles:1,life:1.2,explosive:true}
};

// ── SKILL DEFS ───────────────────────────────────────────────────
const SKILL_DEFS = {
  shockwave:{name:'Shockwave',emoji:'⚡',focusCost:40,cooldown:1.4,
    desc:'Onda de choque em área'},
  energyShield:{name:'E. Shield',emoji:'🛡️',focusCost:50,cooldown:8,
    desc:'Escudo completo por 3s'},
  grenadeStorm:{name:'Grenade Storm',emoji:'💥',focusCost:60,cooldown:12,
    desc:'8 granadas em arco'},
  pierceMode:{name:'Pierce Mode',emoji:'🎯',focusCost:35,cooldown:4.5,
    desc:'Projéteis atravessam tudo por 4.5s'},
  cloakDash:{name:'Cloak Dash',emoji:'👤',focusCost:30,cooldown:6,
    desc:'Dash invisível, +dano no próximo tiro'},
  timeStop:{name:'Time Stop',emoji:'⏸️',focusCost:70,cooldown:15,
    desc:'Para todos os inimigos por 2.5s'},
  blinkBurst:{name:'Blink Burst',emoji:'🌀',focusCost:45,cooldown:2.5,
    desc:'Teleporta para cursor, explode na saída'},
  voidNova:{name:'Void Nova',emoji:'🌑',focusCost:55,cooldown:8,
    desc:'Nova de vazio em área massiva'},
  temporalLoop:{name:'Temporal Loop',emoji:'🔄',focusCost:80,cooldown:18,
    desc:'Reseta HP/foco para valores do início da wave'},
  deathMark:{name:'Death Mark',emoji:'💀',focusCost:30,cooldown:3,
    desc:'Marca inimigo: morrer causa explosão'},
  soulDrain:{name:'Soul Drain',emoji:'🩸',focusCost:40,cooldown:6,
    desc:'Drena 40% HP do inimigo mais próximo'},
  phantomStrike:{name:'Phantom Strike',emoji:'⚔️',focusCost:50,cooldown:10,
    desc:'3 traços rápidos causando dano pesado'}
};

const META_DEFAULT = {relicShards:0, unlockedRelics:[], highScore:0};
const RELICS = [
  {id:'glass_core',name:'Glass Core',desc:'+20% dano global.',cost:8,apply:g=>g.upgrades.damage+=0.2},
  {id:'blood_thread',name:'Blood Thread',desc:'+5% lifesteal.',cost:10,apply:g=>g.upgrades.lifesteal+=0.05},
  {id:'swift_circuit',name:'Swift Circuit',desc:'+14% velocidade.',cost:8,apply:g=>g.upgrades.speed+=0.14},
  {id:'focus_prism',name:'Focus Prism',desc:'+30 foco máximo.',cost:9,apply:g=>{g.player.maxFocus+=30;g.player.focus+=30}},
  {id:'armor_lattice',name:'Armor Lattice',desc:'+10% armadura.',cost:10,apply:g=>g.upgrades.armor+=0.1},
  {id:'drone_seed',name:'Drone Seed',desc:'Começa com drone.',cost:14,apply:g=>g.upgrades.droneUnlocked=true},
  {id:'vampiric_core',name:'Vampiric Core',desc:'Kills curam 6 HP.',cost:12,apply:g=>g.upgrades.killHeal=6},
  {id:'crit_matrix',name:'Crit Matrix',desc:'+15% chance crítico.',cost:11,apply:g=>g.upgrades.critChance+=0.15},
  {id:'shield_cell',name:'Shield Cell',desc:'+25 escudo máx.',cost:10,apply:g=>{g.player.maxShield+=25;g.player.shield+=25}},
  {id:'combo_amp',name:'Combo Amp',desc:'Combo máximo +2 nível bônus.',cost:13,apply:g=>g.upgrades.comboBonus+=2}
];

// ── EVENTS ───────────────────────────────────────────────────────
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(!game||!game.running) return;
  if(e.key==='Shift') startDash();
  if(k==='e') useSkill(0);
  if(k==='q') useSkill(1);
  if(k==='r') useSkill(2);
});
window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove', e=>{
  const rect=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-rect.left)*(canvas.width/rect.width);
  mouse.y=(e.clientY-rect.top)*(canvas.height/rect.height);
});
canvas.addEventListener('mousedown', ()=>mouse.down=true);
window.addEventListener('mouseup', ()=>mouse.down=false);
canvas.addEventListener('click', ()=>{if(game&&game.running) shoot()});
returnWeaponBtn.addEventListener('click', ()=>{
  if(!game) return;
  game.weaponKey=CLASSES[game.classKey].weapon;
  updateHUD();
  addFloatingText(game.player.x,game.player.y-24,'ARMA INICIAL','#ffe38c',16);
});

// ── UTILS ────────────────────────────────────────────────────────
const rand=(a,b)=>Math.random()*(b-a)+a;
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angleTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const circleCollide=(a,b)=>dist(a,b)<a.r+b.r;
function randomChoices(arr,n){const p=[...arr],o=[];while(o.length<n&&p.length)o.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);return o}

function loadMeta(){
  try{const r=localStorage.getItem(SAVE_KEY);if(!r)return structuredClone(META_DEFAULT);
    const d=JSON.parse(r);return{relicShards:Number(d.relicShards||0),unlockedRelics:Array.isArray(d.unlockedRelics)?d.unlockedRelics:[],highScore:Number(d.highScore||0)};
  }catch{return structuredClone(META_DEFAULT)}
}
function saveMeta(){localStorage.setItem(SAVE_KEY,JSON.stringify(game.meta))}

// ── GAME RESET ───────────────────────────────────────────────────
function resetGame(classKey){
  const cls = CLASSES[classKey];
  game = {
    running:true, time:0, dtScale:1, shake:0, flash:0, flashColor:'#fff',
    score:0, kills:0, gold:0,
    combo:1, comboTimer:0, comboMax:0,
    wave:1, enemiesToSpawn:8, enemiesSpawnedThisWave:0,
    enemiesKilledThisWave:0, spawnTimer:0.6,
    betweenWaves:false, shopPending:false,
    bullets:[], enemyBullets:[], enemies:[], particles:[], rings:[],
    floatingTexts:[], loot:[], hazards:[], drones:[],
    lightnings:[], shockwaves:[], deathMarks:[],
    bossActive:false, waveBoss:false,
    level:1, xp:0, xpNext:60,
    classKey, weaponKey:cls.weapon,
    meta:loadMeta(),
    timeStopActive:0,
    cloakActive:0, cloakBonus:false,
    loopHpSnapshot:0, loopFocusSnapshot:0,
    waveAnnounce:'', waveAnnounceTimer:0,
    upgrades:{
      damage:1, fireRate:1, speed:1, lifesteal:0,
      critChance:0.15, multishot:0, pierce:0, armor:0,
      focusRegen:1, lootBonus:0, droneUnlocked:false,
      killHeal:0, comboBonus:0, explosiveBullets:false
    },
    shopCounts:{shotgun:0,hpMax:0,focusMax:0,damageBoost:0,armorBoost:0,droneRepair:0,plasma:0,cannon:0},
    shopLimits:{shotgun:1,hpMax:8,focusMax:6,damageBoost:6,armorBoost:5,droneRepair:3,plasma:1,cannon:1},
    skillCds:[0,0,0],
    player:{
      x:W/2, y:H/2, r:14, vx:0, vy:0, speed:cls.speed,
      hp:cls.hp, maxHp:cls.hp,
      shield:cls.shield, maxShield:cls.shield,
      focus:cls.focus, maxFocus:cls.focus,
      dashCharge:100, fireCd:0, hurtCd:0,
      dashTime:0, dashAngle:0, trail:[]
    }
  };
  applyMetaRelics();
  spawnInitialDroneIfNeeded();
  game.loopHpSnapshot = game.player.hp;
  game.loopFocusSnapshot = game.player.focus;
  startNextWave();
  updateHUD();
}

function applyMetaRelics(){
  for(const id of game.meta.unlockedRelics){
    const r=RELICS.find(x=>x.id===id);
    if(r) r.apply(game);
  }
}
function spawnInitialDroneIfNeeded(){
  if(!game.upgrades.droneUnlocked) return;
  game.drones.push({angle:0,dist:58,fireCd:0,x:0,y:0});
}

// ── HUD ─────────────────────────────────────────────────────────
function updateHUD(){
  if(!game) return;
  const p = game.player;
  hpBar.style.width=`${(p.hp/p.maxHp)*100}%`;
  shieldBar.style.width=`${(p.shield/p.maxShield)*100}%`;
  focusBar.style.width=`${(p.focus/p.maxFocus)*100}%`;
  dashBar.style.width=`${clamp(p.dashCharge,0,100)}%`;
  xpBar.style.width=`${(game.xp/game.xpNext)*100}%`;
  scoreEl.textContent=game.score;
  waveEl.textContent=game.wave;
  killsEl.textContent=game.kills;
  levelEl.textContent=game.level;
  goldEl.textContent=game.gold;
  comboEl.textContent=`x${game.combo}`;
  classLabel.textContent=CLASSES[game.classKey].name;
  weaponLabel.textContent=WEAPONS[game.weaponKey].name;

  const skills = CLASSES[game.classKey].skills;
  for(let i=0;i<3;i++){
    const sk = SKILL_DEFS[skills[i]];
    const cd = game.skillCds[i];
    document.getElementById(`skillEmoji${i+1}`).textContent = sk.emoji;
    const cdEl = document.getElementById(`skillCd${i+1}`);
    if(cd>0){cdEl.style.display='flex';cdEl.textContent=cd.toFixed(1);}
    else cdEl.style.display='none';
  }
}

// ── PARTICLES ───────────────────────────────────────────────────
function addParticles(x,y,color,count,force=1){
  for(let i=0;i<count;i++){
    const a=rand(0,Math.PI*2),sp=rand(30,260)*force;
    game.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:rand(0.25,0.85),maxLife:0.85,size:rand(1.5,5),color});
  }
}
function addRing(x,y,color,maxR=40,width=3){
  game.rings.push({x,y,r:8,maxR,width,life:0.4,maxLife:0.4,color});
}
function addFloatingText(x,y,text,color='#fff',size=15){
  game.floatingTexts.push({x,y,text,color,size,life:0.9,maxLife:0.9});
}
function addLightning(x1,y1,x2,y2,color='#7efff5'){
  game.lightnings.push({x1,y1,x2,y2,life:0.15,maxLife:0.15,color});
}

// ── WAVE ────────────────────────────────────────────────────────
function getHazardsForWave(wave){
  const h=[];
  if(wave>=4) h.push({type:'laserColumn',x:W*0.28,width:18,pulse:rand(0,Math.PI*2),damageCd:0});
  if(wave>=7) h.push({type:'laserColumn',x:W*0.72,width:18,pulse:rand(0,Math.PI*2),damageCd:0});
  if(wave>=10) h.push({type:'voidPool',x:W*0.5,y:H*0.5,r:55,pulse:rand(0,Math.PI*2),damageCd:0});
  if(wave>=13) h.push({type:'laserColumn',x:W*0.5,width:14,pulse:rand(0,Math.PI*2),damageCd:0});
  if(wave>=16) h.push({type:'voidPool',x:W*0.25,y:H*0.35,r:45,pulse:rand(0,Math.PI*2),damageCd:0});
  return h;
}

function startNextWave(){
  game.enemiesSpawnedThisWave=0;
  game.enemiesKilledThisWave=0;
  game.spawnTimer=0.6;
  game.waveBoss=game.wave%5===0;
  game.enemiesToSpawn=game.waveBoss?1:8+game.wave*2;
  game.bossActive=false;
  game.hazards=getHazardsForWave(game.wave);
  game.loopHpSnapshot=game.player.hp;
  game.loopFocusSnapshot=game.player.focus;

  game.waveAnnounce=game.waveBoss?`⚠ BOSS WAVE ${game.wave} ⚠`:`WAVE ${game.wave}`;
  game.waveAnnounceTimer=1.8;
}

// ── SPAWN ENEMY ──────────────────────────────────────────────────
function spawnEnemy(){
  const side=Math.floor(rand(0,4));
  let x,y;
  if(side===0){x=rand(0,W);y=-40}
  if(side===1){x=W+40;y=rand(0,H)}
  if(side===2){x=rand(0,W);y=H+40}
  if(side===3){x=-40;y=rand(0,H)}

  if(game.waveBoss&&!game.bossActive){spawnBoss();game.enemiesSpawnedThisWave++;return}

  const roll=Math.random();
  let type='chaser';
  if(roll>0.5&&roll<=0.7) type='strafer';
  if(roll>0.7&&roll<=0.82) type='tank';
  if(roll>0.82&&roll<=0.9) type='bomber';
  if(roll>0.9&&roll<=0.95) type='swarmer';
  if(roll>0.95) type='sentinel';

  const elite=Math.random()<Math.min(0.06+game.wave*0.012,0.25);
  const wb=Math.floor((game.wave-1)/3)*5;

  const bases={
    chaser:{r:12,speed:rand(85,115),hp:26,color:'#ff5e7e',value:10},
    strafer:{r:10,speed:rand(125,160),hp:20,color:'#ffb86b',value:14},
    tank:{r:19,speed:rand(50,70),hp:62,color:'#c38bff',value:20},
    bomber:{r:14,speed:rand(88,108),hp:25,color:'#ff9966',value:18},
    swarmer:{r:7,speed:rand(160,210),hp:12,color:'#ff4fa8',value:8},
    sentinel:{r:16,speed:rand(40,60),hp:45,color:'#4ce0b3',value:22}
  };
  const b=bases[type];
  const m=elite?1.85:1;

  game.enemies.push({
    x,y,vx:0,vy:0,
    r:elite?b.r+4:b.r,
    speed:(b.speed+game.wave*3+wb)*(elite?1.18:1),
    hp:Math.floor((b.hp+game.wave*3)*m),
    maxHp:Math.floor((b.hp+game.wave*3)*m),
    type,value:elite?b.value*2:b.value,
    color:b.color,elite,wobble:rand(0,Math.PI*2),
    hitFlash:0,shotTimer:rand(1.2,2.4),
    shieldHp:elite?Math.floor(b.hp*0.3):0,
    marked:false, markedTimer:0,
    frozenTime:0
  });
  game.enemiesSpawnedThisWave++;
}

// ── SPAWN BOSS ───────────────────────────────────────────────────
function spawnBoss(){
  game.bossActive=true;
  const isMega=game.wave%10===0;
  const wb=Math.floor((game.wave-1)/3)*4;

  if(!isMega){
    game.enemies.push({
      bossType:'archon',x:W/2,y:-90,vx:0,vy:0,r:44,
      speed:52+wb*0.4,hp:3500+game.wave*40,maxHp:3500+game.wave*40,
      type:'boss',value:300,color:'#ff2e63',elite:false,wobble:0,hitFlash:0,
      shotTimer:1.3,phase:1,summonTimer:3,shieldHp:0,marked:false,frozenTime:0,
      auraAngle:0
    });
  } else {
    game.enemies.push({
      bossType:'titan',x:W/2,y:-120,vx:0,vy:0,r:62,
      speed:30+wb*0.25,hp:4700+game.wave*60,maxHp:4700+game.wave*60,
      type:'boss',value:500,color:'#7b61ff',elite:false,wobble:0,hitFlash:0,
      shotTimer:1.1,phase:1,summonTimer:4,slamTimer:3.5,laserTimer:6,
      shieldHp:0,marked:false,frozenTime:0,auraAngle:0
    });
  }
  addRing(W/2,140,isMega?'#7b61ff':'#ff2e63',120,5);
  game.flash=0.45; game.flashColor='#ff2e63';
}

// ── SHOOT ────────────────────────────────────────────────────────
function shoot(){
  const p=game.player;
  if(!game.running||p.fireCd>0) return;
  const weapon=WEAPONS[game.weaponKey];
  const baseAngle=angleTo(p,mouse);
  const extra=game.upgrades.multishot;
  const total=weapon.projectiles+extra;
  const pierce=game.upgrades.pierce+(p.railPierceMode>0?4:0);
  const cloakBonus=game.cloakBonus;
  if(cloakBonus){game.cloakBonus=false;game.cloakActive=0}

  for(let i=0;i<total;i++){
    const off=(i-(total-1)/2)*weapon.spread;
    const ang=baseAngle+off;
    const dmg=weapon.damage*game.upgrades.damage*(cloakBonus?2.5:1)*(game.combo>4?1+(game.combo-4)*0.05:1);
    game.bullets.push({
      x:p.x+Math.cos(ang)*20,y:p.y+Math.sin(ang)*20,
      vx:Math.cos(ang)*weapon.bulletSpeed,vy:Math.sin(ang)*weapon.bulletSpeed,
      r:game.weaponKey==='rail'?5:game.weaponKey==='cannon'?8:game.weaponKey==='orb'?7:4,
      life:weapon.life,damage:dmg,pierce,
      weaponKey:game.weaponKey,
      explosive:weapon.explosive||game.upgrades.explosiveBullets
    });
  }
  p.fireCd=weapon.cooldown/game.upgrades.fireRate;
  addParticles(p.x+Math.cos(baseAngle)*20,p.y+Math.sin(baseAngle)*20,
    CLASSES[game.classKey].color,5,0.5);
}

// ── DASH ────────────────────────────────────────────────────────
function startDash(){
  const p=game.player;
  if(p.dashCharge<100||p.dashTime>0) return;
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup']) dy=-1;
  if(keys['s']||keys['arrowdown']) dy+=1;
  if(keys['a']||keys['arrowleft']) dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  let a=Math.atan2(dy,dx);
  if(!dx&&!dy) a=angleTo(p,mouse);
  p.dashTime=0.18; p.dashAngle=a; p.dashCharge=0;
  game.shake=9;
  addRing(p.x,p.y,'#ffe07a',65);
}

// ── SKILLS ───────────────────────────────────────────────────────
function useSkill(idx){
  const p=game.player;
  if(game.skillCds[idx]>0||!game.running) return;
  const skillKeys=CLASSES[game.classKey].skills;
  const skillKey=skillKeys[idx];
  const sk=SKILL_DEFS[skillKey];
  if(p.focus<sk.focusCost) return;
  p.focus-=sk.focusCost;
  game.skillCds[idx]=sk.cooldown;

  if(skillKey==='shockwave'){
    for(let i=game.enemies.length-1;i>=0;i--){
      const e=game.enemies[i];
      if(dist(p,e)<155){
        e.hp-=50*game.upgrades.damage; e.hitFlash=0.15;
        const a=angleTo(p,e); e.x+=Math.cos(a)*20; e.y+=Math.sin(a)*20;
        addLightning(p.x,p.y,e.x,e.y,'#7efff5');
        if(e.hp<=0) enemyDeath(i,e);
      }
    }
    addRing(p.x,p.y,'#7efff5',155,5); game.shake=14;
  }

  if(skillKey==='energyShield'){
    p.shield=p.maxShield;
    game.shockwaves=game.shockwaves||[];
    game.shockwaves.push({x:p.x,y:p.y,r:0,maxR:200,life:0.5,maxLife:0.5,color:'#4ce0b3'});
    addFloatingText(p.x,p.y-28,'ESCUDO COMPLETO','#4ce0b3',17);
  }

  if(skillKey==='grenadeStorm'){
    for(let i=0;i<8;i++){
      const a=(Math.PI*2/8)*i;
      const tx=p.x+Math.cos(a)*200, ty=p.y+Math.sin(a)*200;
      setTimeout(()=>{
        if(!game||!game.running) return;
        addRing(tx,ty,'#ff9966',70,5);
        addParticles(tx,ty,'#ff9966',18,1.1);
        for(let j=game.enemies.length-1;j>=0;j--){
          const e=game.enemies[j];
          if(dist({x:tx,y:ty},e)<75){
            e.hp-=45*game.upgrades.damage; e.hitFlash=0.15;
            if(e.hp<=0) enemyDeath(j,e);
          }
        }
      },i*120);
    }
  }

  if(skillKey==='pierceMode'){
    p.railPierceMode=4.5;
    addFloatingText(p.x,p.y-28,'PIERCE MODE','#ffe38c',18);
    addRing(p.x,p.y,'#ffe38c',60,5);
  }

  if(skillKey==='cloakDash'){
    game.cloakActive=2.5; game.cloakBonus=true;
    startDash();
    addFloatingText(p.x,p.y-28,'INVISÍVEL','#b0f0ff',16);
  }

  if(skillKey==='timeStop'){
    game.timeStopActive=2.5;
    game.flash=0.35; game.flashColor='#b0d8ff';
    addFloatingText(W/2,H/2,'⏸ TEMPO PARADO','#b0d8ff',24);
    addRing(W/2,H/2,'#b0d8ff',400,4);
    game.shake=16;
  }

  if(skillKey==='blinkBurst'){
    const fromX=p.x, fromY=p.y;
    p.x=clamp(mouse.x,20,W-20); p.y=clamp(mouse.y,20,H-20);
    addRing(fromX,fromY,'#c6a0ff',60,4);
    addRing(p.x,p.y,'#c6a0ff',80,5);
    for(let i=game.enemies.length-1;i>=0;i--){
      const e=game.enemies[i];
      if(dist(p,e)<120){e.hp-=40*game.upgrades.damage;e.hitFlash=0.12;if(e.hp<=0) enemyDeath(i,e);}
    }
    game.shake=9;
  }

  if(skillKey==='voidNova'){
    addRing(p.x,p.y,'#c6a0ff',240,6);
    addParticles(p.x,p.y,'#c6a0ff',40,1.4);
    game.flash=0.4; game.flashColor='#c6a0ff';
    for(let i=game.enemies.length-1;i>=0;i--){
      const e=game.enemies[i];
      const d=dist(p,e);
      if(d<245){
        const dmg=60*(1-d/245)*game.upgrades.damage;
        e.hp-=dmg; e.hitFlash=0.15;
        const a=angleTo(p,e);
        e.x+=Math.cos(a)*(1-d/245)*60;
        e.y+=Math.sin(a)*(1-d/245)*60;
        if(e.hp<=0) enemyDeath(i,e);
      }
    }
    game.shake=18;
  }

  if(skillKey==='temporalLoop'){
    p.hp=clamp(game.loopHpSnapshot,0,p.maxHp);
    p.focus=clamp(game.loopFocusSnapshot,0,p.maxFocus);
    p.shield=p.maxShield;
    addRing(p.x,p.y,'#ffd166',80,5);
    addFloatingText(p.x,p.y-28,'LOOP TEMPORAL','#ffd166',20);
    game.flash=0.4; game.flashColor='#ffd166';
  }

  if(skillKey==='deathMark'){
    let closest=null, minD=Infinity;
    for(const e of game.enemies){const d=dist(p,e);if(d<minD){minD=d;closest=e}}
    if(closest){
      closest.marked=true; closest.markedTimer=8;
      addFloatingText(closest.x,closest.y-20,'MARCADO','#ff4d6d',14);
      addRing(closest.x,closest.y,'#ff4d6d',40,4);
    }
  }

  if(skillKey==='soulDrain'){
    let closest=null, minD=Infinity;
    for(const e of game.enemies){const d=dist(p,e);if(d<minD){minD=d;closest=e}}
    if(closest&&minD<320){
      const drain=closest.hp*0.4;
      closest.hp-=drain; closest.hitFlash=0.2;
      const heal=Math.min(drain*0.3,p.maxHp-p.hp);
      p.hp+=heal;
      addLightning(p.x,p.y,closest.x,closest.y,'#ff7b9c');
      addFloatingText(p.x,p.y-24,`+${Math.floor(heal)} HP`,'#ff7b9c',16);
      if(closest.hp<=0){const i=game.enemies.indexOf(closest);if(i>=0) enemyDeath(i,closest);}
    }
  }

  if(skillKey==='phantomStrike'){
    let targets=[...game.enemies].sort((a,b)=>dist(p,a)-dist(p,b)).slice(0,3);
    let delay=0;
    for(const t of targets){
      setTimeout(()=>{
        if(!game||!game.running) return;
        const fromX=game.player.x, fromY=game.player.y;
        game.player.x=t.x+rand(-20,20);
        game.player.y=t.y+rand(-20,20);
        t.hp-=80*game.upgrades.damage; t.hitFlash=0.2;
        addParticles(t.x,t.y,'#ff7b9c',12,0.9);
        addLightning(fromX,fromY,t.x,t.y,'#ff7b9c');
        const i=game.enemies.indexOf(t);
        if(i>=0&&t.hp<=0) enemyDeath(i,t);
      },delay);
      delay+=200;
    }
  }

  p.railPierceMode=skillKey==='pierceMode'?4.5:p.railPierceMode||0;
}

// ── DAMAGE PLAYER ────────────────────────────────────────────────
function dealDamageToPlayer(amount){
  const p=game.player;
  if(game.cloakActive>0) return;
  let dmg=amount*(1-Math.min(game.upgrades.armor,0.55));
  if(p.shield>0){
    const absorbed=Math.min(p.shield,dmg);
    p.shield-=absorbed; dmg-=absorbed;
    if(dmg<=0){game.flash=0.12;game.flashColor='#4ce0b3';return}
  }
  p.hp-=dmg; p.hurtCd=0.55;
  game.flash=0.2; game.flashColor='#ff7b92'; game.shake=9;
  addParticles(p.x,p.y,'#ff7b92',10,0.65);
  if(p.hp<=0){p.hp=0;gameOver()}
}

// ── ENEMY DEATH ──────────────────────────────────────────────────
function enemyDeath(index,e){
  const{x,y,color,value,type,elite}=e;
  const wasBoss=type==='boss';
  game.enemies.splice(index,1);
  game.kills++;
  game.enemiesKilledThisWave++;

  // Combo
  game.combo=Math.min(game.combo+1,20);
  game.comboTimer=3.5;

  const comboMult=1+(game.combo-1)*0.08+game.upgrades.comboBonus*0.05;
  game.score+=Math.floor((elite?value*2:value)*comboMult);
  gainXP(wasBoss?65:elite?22:12);

  const gg=wasBoss?55:elite?randi(10,16):randi(2,7);
  spawnGold(x,y,gg+Math.floor(game.upgrades.lootBonus));
  if(Math.random()<0.35) spawnShard(x,y);
  if(elite&&Math.random()<0.28) spawnRelicShard(x,y,1);
  if(wasBoss) spawnRelicShard(x,y,3);
  if(type==='bomber') bomberExplosion(x,y);

  if(e.marked){
    addRing(x,y,'#ff4d6d',90,5);
    addParticles(x,y,'#ff4d6d',20,1.2);
    for(let j=game.enemies.length-1;j>=0;j--){
      const en=game.enemies[j];
      if(dist({x,y},en)<90){en.hp-=55*game.upgrades.damage;en.hitFlash=0.15;if(en.hp<=0) enemyDeath(j,en);}
    }
  }

  if(game.upgrades.killHeal>0){
    game.player.hp=clamp(game.player.hp+game.upgrades.killHeal,0,game.player.maxHp);
  }

  if(wasBoss){
    game.bossActive=false; game.shopPending=true;
    addFloatingText(W/2,H/2-20,'BOSS DOWN!','#ff9bb3',28);
    game.flash=0.5; game.flashColor='#ff2e63'; game.shake=20;
  }

  addParticles(x,y,color,wasBoss?40:20,1);
  addRing(x,y,color,wasBoss?90:42,wasBoss?5:3);

  if(game.combo>3) addFloatingText(x,y-22,`x${game.combo} COMBO!`,'#ffd166',14);
}

function bomberExplosion(x,y){
  addRing(x,y,'#ff9966',88,5);
  addParticles(x,y,'#ff9966',20,1.1);
  const p=game.player;
  if(dist({x,y,r:0},p)<90&&p.hurtCd<=0&&p.dashTime<=0) dealDamageToPlayer(18);
  for(let i=game.enemies.length-1;i>=0;i--){
    const e=game.enemies[i];
    if(dist({x,y,r:0},e)<85){e.hp-=30;e.hitFlash=0.12;if(e.hp<=0) enemyDeath(i,e);}
  }
}

// ── BOSS SHOOT ───────────────────────────────────────────────────
function bossShoot(e){
  const p=game.player;
  const base=angleTo(e,p);
  if(e.bossType==='archon'){
    const count=e.phase===1?5:16;
    const spread=e.phase===1?0.14:Math.PI*2/16;
    for(let i=0;i<count;i++){
      const a=e.phase===1?base+(i-2)*spread:(Math.PI*2/count)*i+game.time*0.8;
      game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*250,vy:Math.sin(a)*250,r:5,life:3,damage:10,color:'#ff7d9d',homing:e.phase===2});
    }
  }
  if(e.bossType==='titan'){
    for(let i=-3;i<=3;i++){
      const a=base+i*0.12;
      game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*220,vy:Math.sin(a)*220,r:7,life:3.5,damage:14,color:'#a996ff',homing:false});
    }
    if(e.phase===2){
      for(let i=0;i<20;i++){
        const a=(Math.PI*2/20)*i;
        game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,r:5,life:3,damage:9,color:'#d4b8ff',homing:false});
      }
    }
  }
  addRing(e.x,e.y,e.color,50,3);
}

// ── UPDATE FUNCS ─────────────────────────────────────────────────
function updatePlayer(dt){
  const p=game.player;
  if(mouse.down) shoot();

  const slowHeld=keys[' '];
  if(slowHeld&&p.focus>0){game.dtScale=0.38;p.focus-=36*dt;}
  else{game.dtScale=1;p.focus+=18*game.upgrades.focusRegen*dt;}
  p.focus=clamp(p.focus,0,p.maxFocus);
  p.fireCd=Math.max(0,p.fireCd-dt);
  p.hurtCd=Math.max(0,p.hurtCd-dt);
  for(let i=0;i<3;i++) game.skillCds[i]=Math.max(0,game.skillCds[i]-dt);
  p.railPierceMode=Math.max(0,(p.railPierceMode||0)-dt);
  game.cloakActive=Math.max(0,game.cloakActive-dt);
  game.timeStopActive=Math.max(0,game.timeStopActive-dt);

  // shield regen slow
  if(p.shield<p.maxShield&&p.hurtCd<=0) p.shield+=4*dt;
  p.shield=clamp(p.shield,0,p.maxShield);

  // combo timer
  if(game.comboTimer>0){game.comboTimer-=dt;if(game.comboTimer<=0) game.combo=1;}

  if(p.dashTime>0){
    p.dashTime-=dt;
    p.vx=Math.cos(p.dashAngle)*800; p.vy=Math.sin(p.dashAngle)*800;
    addParticles(p.x,p.y,'#ffe08c',3,0.3);
  } else {
    let dx=0,dy=0;
    if(keys['w']||keys['arrowup']) dy-=1;
    if(keys['s']||keys['arrowdown']) dy+=1;
    if(keys['a']||keys['arrowleft']) dx-=1;
    if(keys['d']||keys['arrowright']) dx+=1;
    const len=Math.hypot(dx,dy)||1;
    if(dx||dy){dx/=len;dy/=len}
    const max=p.speed*game.upgrades.speed;
    p.vx+=dx*1500*dt; p.vy+=dy*1500*dt;
    const damp=Math.pow(0.0005,dt);
    p.vx*=damp; p.vy*=damp;
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>max){p.vx=(p.vx/sp)*max;p.vy=(p.vy/sp)*max}
  }

  p.x+=p.vx*dt; p.y+=p.vy*dt;
  p.x=clamp(p.x,18,W-18); p.y=clamp(p.y,18,H-18);
  if(p.dashCharge<100) p.dashCharge+=60*dt;
  p.dashCharge=clamp(p.dashCharge,0,100);

  // trail
  if(!p.trail) p.trail=[];
  p.trail.unshift({x:p.x,y:p.y});
  if(p.trail.length>12) p.trail.pop();
}

function updateBullets(dt){
  for(let i=game.bullets.length-1;i>=0;i--){
    const b=game.bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.weaponKey==='orb'){b.vx*=0.996;b.vy*=0.996}
    if(b.life<=0||b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){game.bullets.splice(i,1);continue}
    for(let j=game.enemies.length-1;j>=0;j--){
      const e=game.enemies[j];
      if(!circleCollide(b,e)) continue;
      if(game.timeStopActive>0&&e.frozenTime>0) e.frozenTime=game.timeStopActive;
      const crit=Math.random()<game.upgrades.critChance;
      const dmg=crit?b.damage*2:b.damage;
      if(e.shieldHp>0){e.shieldHp-=dmg;if(e.shieldHp<0){e.hp+=e.shieldHp;e.shieldHp=0}}
      else e.hp-=dmg;
      e.hitFlash=0.1;
      addParticles(b.x,b.y,e.color,5,0.5);
      if(crit) addFloatingText(e.x,e.y-16,'CRÍTICO!','#ffd166',15);
      if(game.upgrades.lifesteal>0) game.player.hp=clamp(game.player.hp+dmg*game.upgrades.lifesteal,0,game.player.maxHp);
      if(b.explosive){
        addRing(b.x,b.y,'#ff9966',55,4);
        for(let k=game.enemies.length-1;k>=0;k--){
          const ek=game.enemies[k];
          if(k!==j&&dist(b,ek)<55){ek.hp-=dmg*0.4;ek.hitFlash=0.08;if(ek.hp<=0) enemyDeath(k,ek);}
        }
        game.bullets.splice(i,1);
      }
      if(e.hp<=0) enemyDeath(j,e);
      b.pierce--;
      if(b.pierce<0){game.bullets.splice(i,1);break}
    }
  }
}

function updateEnemyBullets(dt){
  const p=game.player;
  for(let i=game.enemyBullets.length-1;i>=0;i--){
    const b=game.enemyBullets[i];
    if(b.homing&&game.timeStopActive<=0){
      const a=angleTo(b,p);
      b.vx+=(Math.cos(a)*300-b.vx)*dt*1.5;
      b.vy+=(Math.sin(a)*300-b.vy)*dt*1.5;
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){game.enemyBullets.splice(i,1);continue}
    if(circleCollide(b,p)&&p.hurtCd<=0&&p.dashTime<=0){dealDamageToPlayer(b.damage);game.enemyBullets.splice(i,1)}
  }
}

function updateEnemies(dt){
  const p=game.player;
  const frozen=game.timeStopActive>0;

  for(let i=game.enemies.length-1;i>=0;i--){
    const e=game.enemies[i];
    e.hitFlash=Math.max(0,e.hitFlash-dt);
    e.wobble+=dt*3.2;
    if(e.marked){e.markedTimer-=dt;if(e.markedTimer<=0){e.marked=false}}

    if(frozen){e.frozenTime=game.timeStopActive;continue}
    const a=angleTo(e,p);

    if(e.type==='chaser'){e.vx=Math.cos(a)*e.speed;e.vy=Math.sin(a)*e.speed}
    if(e.type==='strafer'){
      const s=Math.sin(e.wobble*2)>0?1:-1;
      e.vx=Math.cos(a)*e.speed*0.7+Math.cos(a+Math.PI/2*s)*e.speed*0.85;
      e.vy=Math.sin(a)*e.speed*0.7+Math.sin(a+Math.PI/2*s)*e.speed*0.85;
    }
    if(e.type==='tank'){e.vx=Math.cos(a)*e.speed;e.vy=Math.sin(a)*e.speed}
    if(e.type==='bomber'){e.vx=Math.cos(a)*e.speed*1.15;e.vy=Math.sin(a)*e.speed*1.15}
    if(e.type==='swarmer'){
      const noise=rand(-0.4,0.4);
      e.vx=Math.cos(a+noise)*e.speed; e.vy=Math.sin(a+noise)*e.speed;
    }
    if(e.type==='sentinel'){
      const keepDist=220;
      const d=dist(e,p);
      if(d<keepDist){e.vx=-Math.cos(a)*e.speed;e.vy=-Math.sin(a)*e.speed}
      else if(d>keepDist+40){e.vx=Math.cos(a)*e.speed*0.7;e.vy=Math.sin(a)*e.speed*0.7}
      else{e.vx*=0.9;e.vy*=0.9}
      e.shotTimer-=dt;
      if(e.shotTimer<=0){
        const ang=angleTo(e,p)+rand(-0.08,0.08);
        game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*300,vy:Math.sin(ang)*300,r:4,life:2.5,damage:8,color:'#4ce0b3',homing:false});
        e.shotTimer=rand(1.0,1.8);
      }
    }

    if(e.type==='boss'){
      e.auraAngle=(e.auraAngle||0)+dt*2.2;
      if(e.bossType==='archon'){
        e.phase=e.hp<e.maxHp*0.45?2:1;
        const tx=W/2+Math.sin(game.time*(e.phase===1?1.1:2))*230;
        const ty=e.phase===1?125:165+Math.cos(game.time*2.2)*65;
        e.vx=(tx-e.x)*1.7; e.vy=(ty-e.y)*1.7;
        e.shotTimer-=dt; e.summonTimer-=dt;
        if(e.shotTimer<=0){bossShoot(e);e.shotTimer=e.phase===1?1.3:0.9}
        if(e.phase===2&&e.summonTimer<=0){summonMinions(e.x,e.y);e.summonTimer=4.5}
      }
      if(e.bossType==='titan'){
        e.phase=e.hp<e.maxHp*0.5?2:1;
        const tx=W/2+Math.sin(game.time*0.9)*180;
        const ty=e.phase===1?140:220;
        e.vx=(tx-e.x)*1.4; e.vy=(ty-e.y)*1.3;
        e.shotTimer-=dt; e.slamTimer-=dt; e.summonTimer-=dt; e.laserTimer-=dt;
        if(e.shotTimer<=0){bossShoot(e);e.shotTimer=e.phase===1?1.3:0.9}
        if(e.slamTimer<=0&&e.phase===2){bossGroundSlam(e);e.slamTimer=4}
        if(e.summonTimer<=0){summonMinions(e.x,e.y);e.summonTimer=5}
        if(e.laserTimer<=0){bossLaserBeam(e);e.laserTimer=8}
      }
    }

    e.x+=e.vx*dt; e.y+=e.vy*dt;

    if(p.dashTime>0&&circleCollide(p,e)){
      e.hp-=90; addParticles(e.x,e.y,'#ffe08c',10,0.9);
      if(e.hp<=0){enemyDeath(i,e);continue}
    }
    if(circleCollide(p,e)&&p.hurtCd<=0&&p.dashTime<=0){
      const dmg=e.type==='tank'?20:e.type==='boss'?24:e.elite?20:13;
      dealDamageToPlayer(dmg);
      const k=angleTo(e,p); p.vx+=Math.cos(k)*260; p.vy+=Math.sin(k)*260;
      if(e.type==='bomber'){bomberExplosion(e.x,e.y);game.enemies.splice(i,1);continue}
    }
  }

  if(game.enemiesSpawnedThisWave<game.enemiesToSpawn){
    game.spawnTimer-=dt;
    if(game.spawnTimer<=0){spawnEnemy();game.spawnTimer=game.waveBoss?999:rand(0.3,0.75)}
  }
}

function bossGroundSlam(e){
  addRing(e.x,e.y,'#9d8cff',200,7);
  game.flash=0.3; game.flashColor='#9d8cff'; game.shake=16;
  const p=game.player;
  if(dist(e,p)<200&&p.hurtCd<=0&&p.dashTime<=0) dealDamageToPlayer(20);
  for(let i=0;i<20;i++){
    const a=(Math.PI*2/20)*i;
    game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,r:5,life:3.3,damage:10,color:'#b5a7ff',homing:false});
  }
}

function bossLaserBeam(e){
  const p=game.player;
  const a=angleTo(e,p);
  addLightning(e.x,e.y,e.x+Math.cos(a)*600,e.y+Math.sin(a)*600,'#ff2e63');
  addLightning(e.x,e.y,e.x+Math.cos(a+0.1)*600,e.y+Math.sin(a+0.1)*600,'#ff6b9d');
  if(p.hurtCd<=0&&p.dashTime<=0){
    const d=Math.abs((p.y-e.y)*Math.cos(a)-(p.x-e.x)*Math.sin(a));
    if(d<25&&dist(e,p)<520) dealDamageToPlayer(22);
  }
  game.shake=12;
}

function summonMinions(x,y){
  const wb=Math.floor((game.wave-1)/3)*5;
  for(let n=0;n<3;n++){
    game.enemies.push({
      x:x+rand(-80,80),y:y+rand(-50,50),vx:0,vy:0,r:11,
      speed:130+game.wave*2+wb,hp:28+game.wave*2,maxHp:28+game.wave*2,
      type:'chaser',value:10,color:'#ff728c',elite:true,
      wobble:rand(0,Math.PI*2),hitFlash:0,shotTimer:1.5,
      shieldHp:0,marked:false,frozenTime:0
    });
  }
  addFloatingText(x,y-24,'INVOCAR!','#ffafc4',16);
}

// ── LOOT ──────────────────────────────────────────────────────────
function spawnShard(x,y){game.loot.push({kind:'shard',x,y,r:8,value:16,heal:3,pulse:rand(0,Math.PI*2)})}
function spawnGold(x,y,amount=5){game.loot.push({kind:'gold',x,y,r:7,value:amount,pulse:rand(0,Math.PI*2)})}
function spawnRelicShard(x,y,amount=1){game.loot.push({kind:'relicShard',x,y,r:9,value:amount,pulse:rand(0,Math.PI*2)})}

function updateLoot(dt){
  const p=game.player;
  for(let i=game.loot.length-1;i>=0;i--){
    const item=game.loot[i];
    item.pulse+=dt*5;
    if(dist(p,item)<110){const a=angleTo(item,p);item.x+=Math.cos(a)*260*dt;item.y+=Math.sin(a)*260*dt}
    if(circleCollide(p,item)){
      if(item.kind==='shard'){p.focus=clamp(p.focus+item.value,0,p.maxFocus);p.hp=clamp(p.hp+item.heal,0,p.maxHp);game.score+=8;addParticles(item.x,item.y,'#6ee7ff',10,0.6)}
      if(item.kind==='gold'){game.gold+=item.value;addParticles(item.x,item.y,'#ffd36d',10,0.6)}
      if(item.kind==='relicShard'){game.meta.relicShards+=item.value;saveMeta();addParticles(item.x,item.y,'#ffb8ff',12,0.7);addFloatingText(item.x,item.y-10,`+${item.value} RELIC`,'#ffb8ff',14)}
      game.loot.splice(i,1);
    }
  }
}

function updateHazards(dt){
  const p=game.player;
  for(const h of game.hazards){
    h.pulse+=dt*2.2; h.damageCd=Math.max(0,h.damageCd-dt);
    if(h.type==='laserColumn'){
      const active=Math.sin(h.pulse)>-0.15;
      if(!active) continue;
      if(Math.abs(p.x-h.x)<h.width+p.r&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(9);h.damageCd=0.42}
    }
    if(h.type==='voidPool'){
      if(dist(p,h)<h.r+p.r&&p.hurtCd<=0&&p.dashTime<=0&&h.damageCd<=0){dealDamageToPlayer(8);h.damageCd=0.5}
    }
  }
}

function updateDrones(dt){
  if(!game.drones.length) return;
  const p=game.player;
  for(const d of game.drones){
    d.angle+=dt*2;
    d.fireCd=Math.max(0,d.fireCd-dt);
    d.x=p.x+Math.cos(d.angle)*d.dist;
    d.y=p.y+Math.sin(d.angle)*d.dist;
    if(d.fireCd<=0){
      let target=null, minD=Infinity;
      for(const e of game.enemies){const dd=dist(d,e);if(dd<280&&dd<minD){minD=dd;target=e}}
      if(target){
        const a=angleTo(d,target);
        game.bullets.push({x:d.x,y:d.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:3,life:0.8,damage:11*game.upgrades.damage,pierce:0,weaponKey:'blaster',explosive:false});
        d.fireCd=0.5; addParticles(d.x,d.y,'#9ff8ff',4,0.4);
      }
    }
  }
}

function updateWaveState(){
  if(game.shopPending&&game.enemies.length===0&&game.enemyBullets.length===0){openShopMenu();return}
  if(game.running&&!game.betweenWaves&&!game.shopPending&&game.enemiesSpawnedThisWave>=game.enemiesToSpawn&&game.enemies.length===0&&game.enemyBullets.length===0){
    game.wave++;
    startNextWave();
  }
}

function updateFX(dt){
  game.shake=Math.max(0,game.shake-dt*22);
  game.flash=Math.max(0,game.flash-dt);
  if(game.waveAnnounceTimer>0) game.waveAnnounceTimer-=dt;
  for(let i=game.particles.length-1;i>=0;i--){
    const p=game.particles[i];
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=Math.pow(0.015,dt);p.vy*=Math.pow(0.015,dt);
    if(p.life<=0) game.particles.splice(i,1);
  }
  for(let i=game.rings.length-1;i>=0;i--){
    const r=game.rings[i];
    r.life-=dt;r.r+=(r.maxR-r.r)*9*dt;
    if(r.life<=0) game.rings.splice(i,1);
  }
  for(let i=game.floatingTexts.length-1;i>=0;i--){
    const t=game.floatingTexts[i];
    t.life-=dt;t.y-=26*dt;
    if(t.life<=0) game.floatingTexts.splice(i,1);
  }
  for(let i=game.lightnings.length-1;i>=0;i--){
    game.lightnings[i].life-=dt;
    if(game.lightnings[i].life<=0) game.lightnings.splice(i,1);
  }
  if(game.shockwaves){
    for(let i=game.shockwaves.length-1;i>=0;i--){
      const s=game.shockwaves[i];
      s.r+=(s.maxR-s.r)*5*dt;s.life-=dt;
      if(s.life<=0) game.shockwaves.splice(i,1);
    }
  }
}

// ── GAIN XP ──────────────────────────────────────────────────────
function gainXP(amount){
  game.xp+=amount;
  while(game.xp>=game.xpNext){game.xp-=game.xpNext;game.level++;game.xpNext=Math.floor(game.xpNext*1.35);openUpgradeMenu()}
}

function openMetaRelicMenu(){

    <p>Fragmentos: <strong>${meta.relicShards}</strong> &bull; Melhorias permanentes entre runs.</p>

      }).join('')}

  [...overlayCard.querySelectorAll('[data-relic]')].forEach(btn=>{

function openShopMenu(){

  const items=[
    {key:'shotgun',name:'Comprar Shotgun',desc:'5 projéteis simultâneos de sofrimento.',cost:34,available:game.weaponKey!=='shotgun'&&game.shopCounts.shotgun<game.shopLimits.shotgun,effect:()=>{game.weaponKey='shotgun';game.shopCounts.shotgun++}},
    {key:'plasma',name:'Comprar Plasma',desc:'2 projéteis com alto dano.',cost:38,available:game.weaponKey!=='plasma'&&game.shopCounts.plasma<game.shopLimits.plasma,effect:()=>{game.weaponKey='plasma';game.shopCounts.plasma++}},
    {key:'cannon',name:'Comprar Cannon',desc:'1 tiro explosivo de 65 dano.',cost:55,available:game.weaponKey!=='cannon'&&game.shopCounts.cannon<game.shopLimits.cannon,effect:()=>{game.weaponKey='cannon';game.shopCounts.cannon++}},
    {key:'hpMax',name:'HP máximo +22',cost:Math.floor(44*Math.pow(1.35,game.shopCounts.hpMax)),desc:'Mais teimosia.',available:game.shopCounts.hpMax<game.shopLimits.hpMax,effect:()=>{game.player.maxHp+=22;game.player.hp+=22;game.shopCounts.hpMax++}},
    {key:'focusMax',name:'Foco máximo +28',cost:Math.floor(38*Math.pow(1.30,game.shopCounts.focusMax)),desc:'Mais slow e skills.',available:game.shopCounts.focusMax<game.shopLimits.focusMax,effect:()=>{game.player.maxFocus+=28;game.player.focus+=28;game.shopCounts.focusMax++}},
    {key:'damageBoost',name:'Dano +18%',cost:Math.floor(48*Math.pow(1.45,game.shopCounts.damageBoost)),desc:'Mais destruição.',available:game.shopCounts.damageBoost<game.shopLimits.damageBoost,effect:()=>{game.upgrades.damage+=0.18;game.shopCounts.damageBoost++}},
    {key:'armorBoost',name:'Armadura +7%',cost:Math.floor(42*Math.pow(1.40,game.shopCounts.armorBoost)),desc:'Você apanha menos.',available:game.shopCounts.armorBoost<game.shopLimits.armorBoost,effect:()=>{game.upgrades.armor+=0.07;game.shopCounts.armorBoost++}},
    {key:'droneRepair',name:'Drone +1 / Upgrade',cost:Math.floor(55*Math.pow(1.5,game.shopCounts.droneRepair)),desc:'Novo drone ou fortifica os existentes.',available:game.shopCounts.droneRepair<game.shopLimits.droneRepair,effect:()=>{if(game.drones.length<3) game.drones.push({angle:rand(0,Math.PI*2),dist:58+game.drones.length*20,fireCd:0,x:0,y:0});else game.upgrades.fireRate+=0.08;game.shopCounts.droneRepair++}}
  ];
  overlay.classList.remove('hidden');
  overlayCard.innerHTML=`
    <h1>LOJA PÓS-BOSS 🛒</h1>
    <p>Boss derrubado. Seus fragmentos permanentes: <b>${game.meta.relicShards}</b><br>Ouro: <strong>${game.gold}</strong></p>
    <div class="shop-grid">
      ${items.map((item,i)=>`
        <button class="shop-btn" data-shop="${i}" ${item.available?'':'disabled'} style="${item.available?'':'opacity:.35;cursor:not-allowed'}">
          <strong>${item.name} — ${item.cost}g</strong>
          <span>${item.desc}</span>
        </button>
      `).join('')}
    </div>
    <div style="margin-top:16px"><button class="main-btn" id="continueBtn">Continuar →</button></div>
    <div class="tipline">Botão amarelo abaixo devolve sua arma inicial.</div>
  `;
  [...overlayCard.querySelectorAll('[data-shop]')].forEach(btn=>{
    const idx=Number(btn.dataset.shop),item=items[idx];
    if(!item.available) return;
    btn.addEventListener('click',()=>{
      if(game.gold<item.cost){addFloatingText(W/2,H/2,'SEM OURO','#ff9ba8',20);return}
      game.gold-=item.cost;item.effect();updateHUD();openShopMenu();
    });
  });
  document.getElementById('continueBtn').addEventListener('click',()=>{
    overlay.classList.add('hidden');game.running=true;game.betweenWaves=false;game.shopPending=false;game.wave++;startNextWave();
  });
}

function gameOver(){
  game.running=false;
  if(game.score>game.meta.highScore){game.meta.highScore=game.score;saveMeta()}
  else saveMeta();
  overlay.classList.remove('hidden');
  const isHS=game.score>=game.meta.highScore;
  overlayCard.innerHTML=`
    <h1>VOCÊ EXPLODIU 💀</h1>
    <p>
      ${isHS?'<strong style="color:#ffd166">🏆 NOVO HIGH SCORE!</strong><br>':''}
      Classe: <strong>${CLASSES[game.classKey].name}</strong><br>
      Score: <strong>${game.score.toLocaleString()}</strong>${isHS?' 🏆':''}<br>
      Wave: <strong>${game.wave}</strong> &bull; Kills: <strong>${game.kills}</strong> &bull; Level: <strong>${game.level}</strong><br>
      Combo máximo: <strong>x${game.comboMax||game.combo}</strong><br>
      Fragmentos: <strong>${game.meta.relicShards}</strong><br><br>
      <em style="opacity:0.6">Sua build estava promissora. Sua resistência a lasers coloridos, menos.</em>
    </p>
    <button class="main-btn" id="restartBtn">Jogar de novo</button>
  `;
  document.getElementById('restartBtn').addEventListener('click',openClassMenu);
}

// ── DRAW ─────────────────────────────────────────────────────────
function drawGrid(){
  const t=game.time*0.7;
  ctx.save();
  ctx.lineWidth=0.8;
  ctx.strokeStyle='rgba(80,120,255,0.06)';
  for(let x=-40;x<W+40;x+=48){ctx.beginPath();ctx.moveTo(x+(t*20%48),0);ctx.lineTo(x+(t*20%48),H);ctx.stroke()}
  for(let y=-40;y<H+40;y+=48){ctx.beginPath();ctx.moveTo(0,y+(t*12%48));ctx.lineTo(W,y+(t*12%48));ctx.stroke()}
  ctx.restore();
}

function drawHazards(){
  for(const h of game.hazards){
    if(h.type==='laserColumn'){
      const active=Math.sin(h.pulse)>-0.15;
      ctx.save();
      ctx.globalAlpha=active?0.22:0.07;
      ctx.fillStyle=active?'#ff5ea0':'#5c2e44';
      ctx.fillRect(h.x-h.width,0,h.width*2,H);
      ctx.globalAlpha=active?0.9:0.2;
      const lg=ctx.createLinearGradient(h.x-3,0,h.x+3,0);
      lg.addColorStop(0,'rgba(255,100,160,0)');
      lg.addColorStop(0.5,active?'#ffc0d9':'#8b6c79');
      lg.addColorStop(1,'rgba(255,100,160,0)');
      ctx.fillStyle=lg;
      ctx.fillRect(h.x-8,0,16,H);
      ctx.restore();
    }
    if(h.type==='voidPool'){
      ctx.save();
      const pr=h.r+Math.sin(h.pulse*2.3)*7;
      const g=ctx.createRadialGradient(h.x,h.y,8,h.x,h.y,pr);
      g.addColorStop(0,'rgba(198,160,255,0.45)');
      g.addColorStop(0.5,'rgba(120,80,200,0.18)');
      g.addColorStop(1,'rgba(198,160,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(h.x,h.y,pr,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(198,160,255,0.3)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(h.x,h.y,pr,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }
}

function drawPlayer(){
  const p=game.player;
  const a=angleTo(p,mouse);
  const color=CLASSES[game.classKey].color;
  const cloaked=game.cloakActive>0;

  ctx.save();
  // trail
  if(p.trail){
    for(let i=p.trail.length-1;i>=0;i--){
      const tr=p.trail[i];
      ctx.globalAlpha=(1-i/p.trail.length)*0.12*(cloaked?0.3:1);
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(tr.x,tr.y,p.r*(1-i/p.trail.length)*0.8,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=cloaked?0.28:1;
  ctx.translate(p.x,p.y);ctx.rotate(a);

  // shield ring
  if(p.shield>0){
    ctx.save();
    ctx.globalAlpha=(p.shield/p.maxShield)*0.35;
    ctx.strokeStyle='#4ce0b3';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,p.r+9,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  ctx.shadowBlur=p.hurtCd>0?18:28;
  ctx.shadowColor=p.hurtCd>0?'#ff7b92':color;

  if(p.railPierceMode>0){
    ctx.strokeStyle='#ffe38c';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,p.r+8,0,Math.PI*2);ctx.stroke();
  }

  if(game.classKey==='assault'){
    ctx.beginPath();ctx.moveTo(0,-p.r-4);ctx.lineTo(p.r+5,0);ctx.lineTo(0,p.r+4);ctx.lineTo(-p.r+2,0);ctx.closePath();
    ctx.fillStyle=color;ctx.fill();
  } else if(game.classKey==='sniper'){
    ctx.beginPath();ctx.roundRect(-p.r,-p.r+2,p.r*2+5,p.r*2-4,8);ctx.fillStyle=color;ctx.fill();
  } else if(game.classKey==='reaper'){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const ang=(Math.PI*2/5)*i-Math.PI/2;
      const ang2=(Math.PI*2/5)*i+Math.PI/10-Math.PI/2;
      ctx.lineTo(Math.cos(ang)*(p.r+4),Math.sin(ang)*(p.r+4));
      ctx.lineTo(Math.cos(ang2)*(p.r-4),Math.sin(ang2)*(p.r-4));
    }
    ctx.closePath();ctx.fillStyle=color;ctx.fill();
  } else {
    ctx.beginPath();ctx.arc(0,0,p.r+2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    ctx.beginPath();ctx.arc(0,0,p.r-5,0,Math.PI*2);ctx.fillStyle='#f4eaff';ctx.fill();
  }

  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(22,-5);ctx.lineTo(22,5);ctx.closePath();
  ctx.fillStyle='#f2fbff';ctx.fill();
  ctx.restore();
}

function drawDrones(){
  for(const d of game.drones){
    ctx.save();ctx.translate(d.x,d.y);
    ctx.shadowBlur=18;ctx.shadowColor='#90f0ff';
    ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fillStyle='#9ff7ff';ctx.fill();
    ctx.strokeStyle='#e4ffff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(13,0);ctx.moveTo(0,-13);ctx.lineTo(0,13);ctx.stroke();
    ctx.restore();
  }
}

function drawEnemies(){
  for(const e of game.enemies){
    ctx.save();ctx.translate(e.x,e.y);
    const pulse=1+Math.sin(game.time*6+e.wobble)*0.06;
    ctx.scale(pulse,pulse);
    ctx.shadowBlur=e.type==='boss'?32:e.elite?24:18;
    ctx.shadowColor=e.color;

    const frozen=game.timeStopActive>0||e.frozenTime>0;
    const fill=e.hitFlash>0?'#fff':(frozen?'#a0d8ff':e.color);

    if(e.type==='chaser'){
      ctx.beginPath();ctx.moveTo(0,-e.r);ctx.lineTo(e.r,0);ctx.lineTo(0,e.r);ctx.lineTo(-e.r,0);ctx.closePath();
      ctx.fillStyle=fill;ctx.fill();
    }
    if(e.type==='strafer'){
      ctx.beginPath();ctx.rect(-e.r,-e.r*0.8,e.r*2,e.r*1.6);ctx.fillStyle=fill;ctx.fill();
      ctx.fillStyle='#fff6dd';ctx.fillRect(-3,-e.r-5,6,9);
    }
    if(e.type==='tank'){
      ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,e.r-5,0,Math.PI*2);ctx.stroke();
    }
    if(e.type==='bomber'){
      ctx.beginPath();ctx.moveTo(0,-e.r-3);ctx.lineTo(e.r+3,0);ctx.lineTo(0,e.r+3);ctx.lineTo(-e.r-3,0);ctx.closePath();
      ctx.fillStyle=fill;ctx.fill();
      ctx.fillStyle='#fff2d9';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
    }
    if(e.type==='swarmer'){
      ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
      ctx.fillStyle='#ffcce6';ctx.font=`bold ${e.r}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    }
    if(e.type==='sentinel'){
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const ang=(Math.PI*2/6)*i;
        ctx.lineTo(Math.cos(ang)*e.r,Math.sin(ang)*e.r);
      }
      ctx.closePath();ctx.fillStyle=fill;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();
    }
    if(e.type==='boss'){
      ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,e.r-9,0,Math.PI*2);ctx.stroke();
      // aura
      const aura=e.auraAngle||0;
      ctx.strokeStyle=e.color+'88';ctx.lineWidth=2;
      for(let i=0;i<6;i++){
        const ang=aura+(Math.PI*2/6)*i;
        ctx.beginPath();ctx.moveTo(Math.cos(ang)*(e.r-5),Math.sin(ang)*(e.r-5));
        ctx.lineTo(Math.cos(ang)*(e.r+16),Math.sin(ang)*(e.r+16));ctx.stroke();
      }
      if(e.bossType==='archon'){
        ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,0.8)';
        ctx.beginPath();ctx.moveTo(-20,-6);ctx.lineTo(20,-6);ctx.moveTo(-20,6);ctx.lineTo(20,6);ctx.stroke();
      } else {
        ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,0.8)';
        ctx.beginPath();ctx.moveTo(-18,-14);ctx.lineTo(0,-26);ctx.lineTo(18,-14);ctx.stroke();
        ctx.beginPath();ctx.moveTo(-18,14);ctx.lineTo(0,26);ctx.lineTo(18,14);ctx.stroke();
      }
    }

    if(e.elite&&e.type!=='boss'){
      ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(0,0,e.r+5,0,Math.PI*2);ctx.stroke();
    }
    if(e.marked){
      ctx.strokeStyle='#ff4d6d';ctx.lineWidth=2;
      ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,0,e.r+8,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);
    }
    if(e.shieldHp>0){
      ctx.globalAlpha=0.5;ctx.strokeStyle='#88ffcc';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,e.r+3,0,Math.PI*2*(e.shieldHp/(e.maxHp*0.3)));ctx.stroke();
      ctx.globalAlpha=1;
    }

    ctx.globalAlpha=0.88;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(-e.r,-e.r-17,e.r*2,5);
    const hpPct=e.hp/e.maxHp;
    const hpColor=hpPct>0.5?'#4ce0b3':hpPct>0.25?'#ffd166':'#ff4d6d';
    ctx.fillStyle=hpColor;ctx.fillRect(-e.r,-e.r-17,hpPct*e.r*2,5);
    ctx.restore();
  }
}

function drawBullets(){
  for(const b of game.bullets){
    ctx.save();
    ctx.shadowBlur=20;
    ctx.shadowColor=b.weaponKey==='rail'?'#ffe38c':b.weaponKey==='orb'?'#c6a0ff':b.weaponKey==='cannon'?'#ff9966':b.weaponKey==='plasma'?'#4ce0b3':'#87f5ff';
    const grd=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2);
    grd.addColorStop(0,'#fff');
    grd.addColorStop(0.5,ctx.shadowColor);
    grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawEnemyBullets(){
  for(const b of game.enemyBullets){
    ctx.save();
    ctx.shadowBlur=14;ctx.shadowColor=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();
    if(b.homing){
      ctx.strokeStyle=b.color+'80';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLoot(){
  for(const item of game.loot){
    ctx.save();ctx.translate(item.x,item.y);ctx.rotate(item.pulse);
    if(item.kind==='shard'){
      ctx.shadowBlur=18;ctx.shadowColor='#5fe7ff';
      ctx.beginPath();ctx.moveTo(0,-item.r-3);ctx.lineTo(item.r,0);ctx.lineTo(0,item.r+3);ctx.lineTo(-item.r,0);ctx.closePath();
      ctx.fillStyle='#8cf1ff';ctx.fill();
    }
    if(item.kind==='gold'){
      ctx.shadowBlur=14;ctx.shadowColor='#ffd36d';
      ctx.beginPath();ctx.arc(0,0,item.r,0,Math.PI*2);ctx.fillStyle='#ffd866';ctx.fill();
    }
    if(item.kind==='relicShard'){
      ctx.shadowBlur=20;ctx.shadowColor='#ffb8ff';
      ctx.beginPath();ctx.moveTo(0,-item.r-3);ctx.lineTo(item.r+3,0);ctx.lineTo(0,item.r+3);ctx.lineTo(-item.r-3,0);ctx.closePath();
      ctx.fillStyle='#ffcfff';ctx.fill();
    }
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of game.particles){
    ctx.save();ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

function drawRings(){
  for(const r of game.rings){
    ctx.save();ctx.globalAlpha=r.life/r.maxLife;
    ctx.strokeStyle=r.color;ctx.lineWidth=r.width;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
}

function drawLightnings(){
  for(const l of game.lightnings){
    ctx.save();ctx.globalAlpha=(l.life/l.maxLife)*0.9;
    ctx.strokeStyle=l.color;ctx.lineWidth=2+Math.random()*1.5;
    ctx.shadowBlur=12;ctx.shadowColor=l.color;
    ctx.beginPath();ctx.moveTo(l.x1,l.y1);
    const segs=6;
    const dx=(l.x2-l.x1)/segs,dy=(l.y2-l.y1)/segs;
    for(let i=1;i<segs;i++){
      ctx.lineTo(l.x1+dx*i+rand(-12,12),l.y1+dy*i+rand(-12,12));
    }
    ctx.lineTo(l.x2,l.y2);ctx.stroke();ctx.restore();
  }
}

function drawShockwaves(){
  if(!game.shockwaves) return;
  for(const s of game.shockwaves){
    ctx.save();ctx.globalAlpha=(s.life/s.maxLife)*0.8;
    ctx.strokeStyle=s.color;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=(s.life/s.maxLife)*0.15;
    ctx.fillStyle=s.color;ctx.fill();
    ctx.restore();
  }
}

function drawFloatingTexts(){
  for(const t of game.floatingTexts){
    ctx.save();ctx.globalAlpha=t.life/t.maxLife;
    ctx.fillStyle=t.color;
    ctx.font=`bold ${t.size}px Orbitron,Arial`;
    ctx.textAlign='center';
    ctx.shadowBlur=8;ctx.shadowColor=t.color;
    ctx.fillText(t.text,t.x,t.y);ctx.restore();
  }
}

function drawCrosshair(){
  ctx.save();
  ctx.strokeStyle='rgba(200,240,255,0.75)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x-15,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);
  ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+15,mouse.y);
  ctx.moveTo(mouse.x,mouse.y-15);ctx.lineTo(mouse.x,mouse.y-5);
  ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+15);
  ctx.stroke();
  ctx.restore();
}

function drawTimeStop(){
  if(game.timeStopActive<=0) return;
  ctx.save();
  ctx.globalAlpha=0.06+Math.sin(game.time*8)*0.02;
  ctx.fillStyle='#b0d8ff';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.6;
  ctx.strokeStyle='rgba(180,220,255,0.4)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.restore();
}

function drawWaveAnnounce(){
  if(game.waveAnnounceTimer<=0) return;
  const alpha=Math.min(1,game.waveAnnounceTimer/0.5)*Math.min(1,(game.waveAnnounceTimer>1?1:(game.waveAnnounceTimer/0.5)));
  ctx.save();ctx.globalAlpha=alpha;
  ctx.font=`bold 52px Orbitron,Arial`;ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.shadowBlur=40;ctx.shadowColor=game.waveBoss?'#ff2e63':'#61dafb';
  ctx.fillText(game.waveAnnounce,W/2,H/2);
  ctx.restore();
}

function drawHints(){
  const p=game.player;
  const skills=CLASSES[game.classKey].skills;
  ctx.save();
  ctx.fillStyle='rgba(180,210,255,0.7)';ctx.font='11px Rajdhani,Arial';ctx.textAlign='left';
  const sk0=SKILL_DEFS[skills[0]];
  ctx.fillText(`E: ${sk0.name} ${game.skillCds[0]>0?'('+game.skillCds[0].toFixed(1)+'s)':'✓'}`,16,H-14);
  ctx.restore();
}

// ── RENDER ───────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  const sx=rand(-game.shake,game.shake),sy=rand(-game.shake,game.shake);
  ctx.save();ctx.translate(sx,sy);

  // ambient glow
  const glow=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,500);
  glow.addColorStop(0,'rgba(60,80,180,0.12)');glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  drawGrid();
  drawHazards();
  drawTimeStop();
  drawRings();
  drawShockwaves();
  drawLoot();
  drawBullets();
  drawEnemyBullets();
  drawLightnings();
  drawEnemies();
  drawDrones();
  drawParticles();
  drawPlayer();
  drawFloatingTexts();
  drawWaveAnnounce();
  drawCrosshair();
  drawHints();
  ctx.restore();

  // flash overlay
  if(game.flash>0){
    ctx.save();ctx.globalAlpha=game.flash*0.32;ctx.fillStyle=game.flashColor||'#fff';ctx.fillRect(0,0,W,H);ctx.restore();
  }
  // vignette
  const vig=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,640);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
}

// ── LOOP ─────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  if(!game) return;
  let dt=(ts-last)/1000||0;last=ts;
  dt=Math.min(dt,0.033);

  if(game.running){
    game.time+=dt;
    const sDt=dt*game.dtScale;
    updatePlayer(dt);
    updateBullets(sDt);
    updateEnemyBullets(sDt);
    updateEnemies(sDt);
    updateLoot(sDt);
    updateHazards(dt);
    updateDrones(dt);
    updateWaveState();
    updateFX(dt);
    updateHUD();
  }
  render();
}

function makeMapDecor(wave){
  const theme=ECLIPSE_UPDATE.themes[Math.floor((wave-1)/3)%ECLIPSE_UPDATE.themes.length];
  const obstacles=[];

  const lanes=[];
  const seed=wave*13.37;

  const addObs=(x,y,w,h,type='block')=>{
    if(Math.abs(x+w/2-W/2)<centerSafe&&Math.abs(y+h/2-H/2)<centerSafe) return;
    obstacles.push({x,y,w,h,type,pulse:rand(0,Math.PI*2)});
  };
  addObs(150+Math.sin(seed)*30,120,88,30,'barrier');
  addObs(W-238+Math.cos(seed)*25,H-150,88,30,'barrier');
  if(wave>=3){addObs(W*0.5-42,90,84,26,'crystal'); addObs(W*0.5-42,H-116,84,26,'crystal');}
  if(wave>=6){addObs(86,H*0.5-55,30,110,'pillar'); addObs(W-116,H*0.5-55,30,110,'pillar');}

  if(wave>=8) lanes.push({x:W/2,y:H/2,ang:Math.PI/4,pulse:0});
  return {theme,obstacles,pads,lanes};
}
function collideCircleRect(c,o){
  const nx=clamp(c.x,o.x,o.x+o.w), ny=clamp(c.y,o.y,o.y+o.h);
  const dx=c.x-nx, dy=c.y-ny;
  return dx*dx+dy*dy<c.r*c.r;
}
function pushCircleOutRect(c,o){
  const nx=clamp(c.x,o.x,o.x+o.w), ny=clamp(c.y,o.y,o.y+o.h);
  let dx=c.x-nx, dy=c.y-ny, len=Math.hypot(dx,dy);
  if(len<0.001){
    const left=Math.abs(c.x-o.x), right=Math.abs(o.x+o.w-c.x), top=Math.abs(c.y-o.y), bot=Math.abs(o.y+o.h-c.y);
    const m=Math.min(left,right,top,bot);
    if(m===left){dx=-1;dy=0;len=1}else if(m===right){dx=1;dy=0;len=1}else if(m===top){dx=0;dy=-1;len=1}else{dx=0;dy=1;len=1}
  }
  const push=c.r-len+0.5;
  if(push>0){c.x+=dx/len*push;c.y+=dy/len*push;c.vx*=0.25;c.vy*=0.25;}
}
function nearestEnemyWithin(origin,range=9999){
  let target=null,minD=range;
  for(const e of game.enemies){const d=dist(origin,e); if(d<minD){minD=d;target=e;}}
  return target;
}
function damageEnemiesInRadius(x,y,r,dmg,color='#fff',knock=0){
  for(let i=game.enemies.length-1;i>=0;i--){
    const e=game.enemies[i]; const d=dist({x,y},e);
    if(d<r+e.r){
      const fall=1-d/(r+e.r);
      e.hp-=dmg*Math.max(0.25,fall)*game.upgrades.damage;
      e.hitFlash=0.15;
      if(knock){const a=angleTo({x,y},e); e.x+=Math.cos(a)*knock*fall; e.y+=Math.sin(a)*knock*fall;}
      addLightning(x,y,e.x,e.y,color);
      if(e.hp<=0) enemyDeath(i,e);
    }
  }
}

function bossShoot(e){
  const p=game.player; const base=angleTo(e,p);
  if(e.bossType==='archon'){
    const phase=e.hp<e.maxHp*0.66?(e.hp<e.maxHp*0.33?3:2):1;
    const count=phase===1?7:phase===2?14:20;
    for(let i=0;i<count;i++){
      const a=phase===1?base+(i-(count-1)/2)*0.105:(Math.PI*2/count)*i+game.time*(phase===3?1.65:0.85);
      game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*(250+phase*18),vy:Math.sin(a)*(250+phase*18),r:5,life:3.1,damage:10+phase,color:'#ff7d9d',homing:phase>=2&&i%3===0});
    }
  }
  if(e.bossType==='titan'){
    for(let i=-4;i<=4;i++){
      const a=base+i*0.105;
      game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*245,vy:Math.sin(a)*245,r:7,life:3.6,damage:14,color:'#a996ff',homing:false});
    }
    if(e.phase===2){
      for(let i=0;i<24;i++){const a=(Math.PI*2/24)*i+game.time*0.4;game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:5,life:3.2,damage:10,color:'#d4b8ff',homing:false});}
    }
  }
  if(e.bossType==='oracle'){
    for(let ring=0;ring<2;ring++){
      for(let i=0;i<11;i++){
        const a=(Math.PI*2/11)*i+game.time*(ring?-.65:.65)+ring*0.18;

  }

}

function updateEnemies(dt){
  const p=game.player; const frozen=game.timeStopActive>0;
  for(let i=game.enemies.length-1;i>=0;i--){
    const e=game.enemies[i];
    e.hitFlash=Math.max(0,e.hitFlash-dt); e.wobble+=dt*3.2;

    if(e.type==='chaser'){e.vx=Math.cos(a)*e.speed;e.vy=Math.sin(a)*e.speed}

      else{e.vx+=(Math.cos(a)*e.speed*0.45-e.vx)*dt*2;e.vy+=(Math.sin(a)*e.speed*0.45-e.vy)*dt*2;}
    }
    if(e.type==='medic'){
      const d=dist(e,p); const side=Math.sin(e.wobble)>0?1:-1;
      e.vx=(d<260?-Math.cos(a):Math.cos(a)*0.25)*e.speed+Math.cos(a+Math.PI/2*side)*e.speed*0.55;
      e.vy=(d<260?-Math.sin(a):Math.sin(a)*0.25)*e.speed+Math.sin(a+Math.PI/2*side)*e.speed*0.55;
      e.healPulse-=dt;
      if(e.healPulse<=0){
        for(const ally of game.enemies){if(ally!==e&&ally.type!=='boss'&&dist(e,ally)<125&&ally.hp<ally.maxHp){ally.hp=clamp(ally.hp+18+game.wave*0.8,0,ally.maxHp);addLightning(e.x,e.y,ally.x,ally.y,'#86ffb0')}}
        e.healPulse=1.6; addRing(e.x,e.y,'#86ffb0',72,2);
      }
    }
    if(e.type==='sniperDrone'){
      const d=dist(e,p); const keep=330;
      if(d<keep){e.vx=-Math.cos(a)*e.speed;e.vy=-Math.sin(a)*e.speed}else{e.vx=Math.cos(a)*e.speed*0.35;e.vy=Math.sin(a)*e.speed*0.35}
      e.aimTimer-=dt;
      if(e.aimTimer<0.42&&e.aimTimer>0.36) addLightning(e.x,e.y,p.x,p.y,'#8fd0ff');
      if(e.aimTimer<=0){const ang=angleTo(e,p);game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*430,vy:Math.sin(ang)*430,r:4,life:2.4,damage:14,color:'#8fd0ff',homing:false});e.aimTimer=rand(2.2,3.0);}
    }
    if(e.type==='splitter'){
      const side=Math.sin(e.wobble*1.5)>0?1:-1;
      e.vx=Math.cos(a)*e.speed*0.85+Math.cos(a+Math.PI/2*side)*e.speed*0.55;
      e.vy=Math.sin(a)*e.speed*0.85+Math.sin(a+Math.PI/2*side)*e.speed*0.55;
    }
    if(e.type==='boss'){
      e.auraAngle=(e.auraAngle||0)+dt*(2.4+(e.phase||1)*0.35);
      if(e.bossType==='archon'){
        e.phase=e.hp<e.maxHp*0.33?3:e.hp<e.maxHp*0.66?2:1;
        const tx=W/2+Math.sin(game.time*(e.phase===1?1.1:e.phase===2?1.7:2.4))*250;
        const ty=e.phase===1?125:160+Math.cos(game.time*(e.phase===3?3.1:2.2))*70;
        e.vx=(tx-e.x)*(1.8+e.phase*0.15); e.vy=(ty-e.y)*(1.75+e.phase*0.1);
        e.shotTimer-=dt; e.summonTimer-=dt; e.burstTimer-=dt;
        if(e.shotTimer<=0){bossShoot(e);e.shotTimer=e.phase===1?1.05:e.phase===2?0.82:0.62}
        if(e.summonTimer<=0&&e.phase>=2){summonMinions(e.x,e.y,e.phase===3?5:3);e.summonTimer=e.phase===3?3.2:4.0}
        if(e.burstTimer<=0&&e.phase===3){bossPhaseNova(e);e.burstTimer=4.6}
      }
      if(e.bossType==='titan'){
        e.phase=e.hp<e.maxHp*0.5?2:1;
        const tx=W/2+Math.sin(game.time*0.95)*190; const ty=e.phase===1?142:214;
        e.vx=(tx-e.x)*1.45; e.vy=(ty-e.y)*1.35;
        e.shotTimer-=dt; e.slamTimer-=dt; e.summonTimer-=dt; e.laserTimer-=dt;
        if(e.shotTimer<=0){bossShoot(e);e.shotTimer=e.phase===1?1.15:0.82}
        if(e.slamTimer<=0&&e.phase===2){bossGroundSlam(e);e.slamTimer=3.25}
        if(e.summonTimer<=0){summonMinions(e.x,e.y,e.phase===2?4:3);e.summonTimer=4.4}
        if(e.laserTimer<=0){bossLaserBeam(e);e.laserTimer=6.4}
      }
      if(e.bossType==='oracle'){
        e.phase=e.hp<e.maxHp*0.5?2:1;
        const tx=W/2+Math.sin(game.time*1.2)*260; const ty=150+Math.cos(game.time*1.4)*52;
        e.vx=(tx-e.x)*(1.55+e.phase*0.25); e.vy=(ty-e.y)*(1.45+e.phase*0.2);
        e.shotTimer-=dt; e.summonTimer-=dt; e.riftTimer-=dt; e.beamTimer-=dt;
        if(e.shotTimer<=0){bossShoot(e);e.shotTimer=e.phase===1?0.95:0.68}
        if(e.riftTimer<=0){game.hazards.push({type:'chronoRift',x:p.x+rand(-80,80),y:p.y+rand(-60,60),r:65,pulse:0,damageCd:0,life:5});e.riftTimer=e.phase===1?3.8:2.7}
        if(e.summonTimer<=0){summonSpecialMinions(e.x,e.y);e.summonTimer=e.phase===1?4.4:3.4}
        if(e.beamTimer<=0){bossLaserBeam(e);bossPhaseNova(e,0.65);e.beamTimer=5.8}
      }
    }

    e.x+=e.vx*dt; e.y+=e.vy*dt;
    e.x=clamp(e.x,-80,W+80); e.y=clamp(e.y,-100,H+80);
    if(game.mapDecor&&game.mapDecor.obstacles&&e.type!=='boss'){
      for(const o of game.mapDecor.obstacles) if(collideCircleRect(e,o)) pushCircleOutRect(e,o);
    }
    if(p.dashTime>0&&circleCollide(p,e)){e.hp-=100;addParticles(e.x,e.y,'#ffe08c',10,0.9);if(e.hp<=0){enemyDeath(i,e);continue}}
    if(circleCollide(p,e)&&p.hurtCd<=0&&p.dashTime<=0){
      const dmg=e.type==='tank'?22:e.type==='leaper'?18:e.type==='boss'?26:e.elite?20:13;
      dealDamageToPlayer(dmg); const k=angleTo(e,p); p.vx+=Math.cos(k)*280; p.vy+=Math.sin(k)*280;
      if(e.type==='bomber'){bomberExplosion(e.x,e.y);game.enemies.splice(i,1);continue}
    }
  }
  if(game.enemiesSpawnedThisWave<game.enemiesToSpawn){game.spawnTimer-=dt;if(game.spawnTimer<=0){spawnEnemy();game.spawnTimer=game.waveBoss?999:rand(0.24,0.66)}}
}

function summonMinions(x,y,count=3){

    const type=Math.random()<0.25&&game.wave>=8?'leaper':'chaser';
    game.enemies.push({x:x+rand(-95,95),y:y+rand(-55,55),vx:0,vy:0,r:type==='leaper'?12:11,
      speed:(type==='leaper'?145:132)+game.wave*2+wb,hp:32+game.wave*2,maxHp:32+game.wave*2,
      type,value:10,color:type==='leaper'?'#ffe066':'#ff728c',elite:true,wobble:rand(0,Math.PI*2),hitFlash:0,shotTimer:1.5,
      shieldHp:0,marked:false,frozenTime:0,leapCd:rand(1.2,2.0),poison:0});
  }
  addFloatingText(x,y-24,'INVOCAR!','#ffafc4',16);
}
function summonSpecialMinions(x,y){
  const types=['medic','sniperDrone','chaser','sentinel'];
  for(let n=0;n<4;n++){
    const type=types[n%types.length];
    const base={medic:{r:14,speed:88,hp:45,color:'#86ffb0',value:22},sniperDrone:{r:12,speed:80,hp:32,color:'#8fd0ff',value:22},chaser:{r:12,speed:140,hp:35,color:'#ff728c',value:12},sentinel:{r:16,speed:62,hp:48,color:'#4ce0b3',value:20}}[type];
    game.enemies.push({x:x+rand(-120,120),y:y+rand(-80,80),vx:0,vy:0,r:base.r,speed:base.speed+game.wave*2,hp:base.hp+game.wave*2,maxHp:base.hp+game.wave*2,type,value:base.value,color:base.color,elite:true,wobble:rand(0,Math.PI*2),hitFlash:0,shotTimer:1.2,shieldHp:0,marked:false,frozenTime:0,leapCd:1.5,healPulse:0,aimTimer:1.2,poison:0});
  }
  addFloatingText(x,y-24,'ANOMALIAS!','#b6ff7a',16);
}
function bossPhaseNova(e,mult=1){
  addRing(e.x,e.y,e.color,210*mult,7); game.shake=14; game.flash=0.25; game.flashColor=e.color;
  if(dist(e,game.player)<210*mult&&game.player.hurtCd<=0&&game.player.dashTime<=0) dealDamageToPlayer(18);
  for(let i=0;i<18;i++){const a=(Math.PI*2/18)*i+game.time;game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*220*mult,vy:Math.sin(a)*220*mult,r:5,life:3,damage:9,color:e.color,homing:false});}
}

function dealDamageToPlayer(amount){
  const p=game.player;
  if(game.cloakActive>0||game.parryTimer>0&&amount<18) return;
  let dmg=amount*(1-Math.min(game.upgrades.armor,0.55));
  if(p.shield>0){
    const absorbed=Math.min(p.shield,dmg); p.shield-=absorbed; dmg-=absorbed;
    if(dmg<=0){p.hurtCd=0.3;game.flash=0.10;game.flashColor='#4ce0b3';return}
  }
  p.hp-=dmg; p.hurtCd=0.3; // pedido: iframe/invencibilidade em 0.3s
  game.flash=0.18; game.flashColor='#ff7b92'; game.shake=8;
  addParticles(p.x,p.y,'#ff7b92',10,0.65);
  if(p.hp<=0){p.hp=0;gameOver()}
}

updatePlayer = function(dt){
  _baseUpdatePlayer(dt);
  ensureEclipseState();
  const p=game.player;
  game.overclockTimer=Math.max(0,game.overclockTimer-dt);
  game.elixirTimer=Math.max(0,game.elixirTimer-dt);
  game.parryTimer=Math.max(0,game.parryTimer-dt);
  if(game.overclockApplied&&game.overclockTimer<=0){game.upgrades.fireRate-=0.45;game.overclockApplied=false;eclipseNotice('Overclock acabou','#8ff8ff',14)}
  if(game.elixirApplied&&game.elixirTimer<=0){game.upgrades.damage-=0.32;game.elixirApplied=false;eclipseNotice('Elixir acabou','#b6ff7a',14)}
  if(game.mapDecor){
    for(const o of game.mapDecor.obstacles) if(collideCircleRect(p,o)) pushCircleOutRect(p,o);
    for(const pad of game.mapDecor.pads){
      pad.pulse+=dt*2;
      if(dist(p,pad)<pad.r+p.r){
        if(pad.type==='speed') p.dashCharge=clamp(p.dashCharge+30*dt,0,100);
        if(pad.type==='focus') p.focus=clamp(p.focus+16*dt,0,p.maxFocus);
      }
    }
  }
  if(p.dashCharge<100) p.dashCharge+=22*(game.upgrades.dashRegen-1)*dt;
};

    }

  }
};

updateEnemyBullets = function(dt){

  if(game.parryTimer>0){
    for(let i=game.enemyBullets.length-1;i>=0;i--){

        game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:4,life:0.9,damage:26*game.upgrades.damage,pierce:1,weaponKey:'rail',explosive:false});

      }
